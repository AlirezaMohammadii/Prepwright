<script>
"use strict";
/* =====================================================================
 *  DATA — the schema every Prepwright track is written in, plus ONE small
 *  synthetic example so the page runs, renders and can be tested before the
 *  generator has produced anything real.
 *
 *  Shape:
 *    meta      one track's identity (role, employer, where the posting came from)
 *    phases    the seven pipeline phases that produce a track, in order
 *    stages    variable-length study blocks, sized to the time left before the
 *              interview, which may be five days or five weeks
 *    topics    T<n> · {s, tier, concept, citation, teach, question, res}
 *              tier: core | depth | reference
 *              citation: a document in the local corpus (name.doc.md)
 *    practice  P<n> · one written thing per stage
 *    checks    C<n> · the bar you have to clear before moving on
 *    questions the interview question bank, answered cold
 *    story     your own resume claims, numbers and risks, ready to defend
 *    sessions  closed sessions, appended as you go
 *    claude / codex   the model registries. Content-free of any track: a
 *              regenerated curriculum MUST carry these two lists over unchanged.
 *
 *  Everything under meta/phases/stages/topics/practice/checks/questions/story
 *  below is a PLACEHOLDER for a made-up backend role. It describes nothing real
 *  and gets replaced wholesale the first time a track is generated.
 * ===================================================================== */
const DATA = {
  meta:{
    track:"Example track (placeholder)",
    role:"Backend Engineer",
    employer:"Example Company",
    sourceKind:"placeholder",          // pasted | folder | placeholder
    targetDate:"",                     // ISO date of the interview, when known
    generatedAt:"",
    note:"This is a placeholder track, not advice about a real job. Prepwright replaces this whole object the first time it builds a real one: intake reads the job description, the diagnostic finds what you already know, you approve the gap list, research fills the corpus, and the curriculum is cut to the roughly 20% of concepts that carry roughly 80% of the value."
  },
  /* The pipeline that produces a track. Shown on Overview so the page explains
   * itself before anything has been generated. */
  phases:{
    intake:{name:"Intake",desc:"Read the job description — pasted into the box, or picked up from the per-job folder — and pull out the role, the employer and the skills it actually asks for."},
    diagnostic:{name:"Diagnostic",desc:"A conversation, not a quiz. Find what you know, what you half-know, and what you have never touched."},
    gaps:{name:"Gap list",desc:"The gaps in priority order. Nothing is researched or taught until you approve the list."},
    research:{name:"Research",desc:"Pull vetted sources for each approved gap and distil them into the local corpus. The tutor may teach only from the corpus."},
    curriculum:{name:"Curriculum",desc:"Cut the corpus to the small share of concepts that carries most of the interview value, then lay it out as stages, topics, practice and checks."},
    teaching:{name:"Teaching",desc:"Work one step at a time in Continue. The tutor asks, you answer, and a step counts as delivered when you can explain it back."},
    review:{name:"Review",desc:"Close each session, bank its recap questions, and run the question bank cold before the real interview."}
  },
  /* Variable length by design. Three here; a real track has as many as the time
   * before the interview allows. */
  stages:[
    {n:1,name:"Ground yourself",focus:"The two ideas the rest of the track leans on."},
    {n:2,name:"The load-bearing answer",focus:"The question this role screens for, said out loud until it is calm."},
    {n:3,name:"Rehearse",focus:"Run the question bank cold and close whatever it exposes."}
  ],
  topics:{
    T1:{s:1,tier:"core",concept:"HTTP caching: what the response headers actually promise",
      citation:"http-caching.doc.md",
      teach:"[Core · 30m] Cache-Control, then ETag, then revalidation, in that order. Say what a client is allowed to do with a stored copy before opening any code.",
      question:"A response carries Cache-Control: max-age=60 and an ETag. What does the client do on a second request at t=90s?",
      res:[
        {t:"MDN, HTTP caching",u:"https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching",w:"The one page. Read Cache-Control and validation; skip everything else on the first pass.",m:20},
        {t:"The corpus note for this topic",u:"http-caching.doc.md",w:"Distilled from the sources you approved. This is what the tutor can see.",m:10}
      ]},
    T2:{s:1,tier:"core",concept:"Database indexes: why a query gets fast, and what it costs",
      citation:"database-indexing.doc.md",
      teach:"[Core · 30m] An index as a sorted lookup structure. Which WHERE clauses it helps, which it cannot help, and what every extra index costs on write.",
      question:"You add an index on (user_id, created_at). Which queries use it, and why does one of them not?",
      res:[
        {t:"The corpus note for this topic",u:"database-indexing.doc.md",w:"Read it once, close it, then say the write cost out loud from memory.",m:15}
      ]},
    T3:{s:2,tier:"depth",concept:"Cache invalidation in a service you did not design",
      citation:"http-caching.doc.md",
      teach:"[Depth · 40m] Stale reads and cache stampedes. The credible answer names the failure mode before it names a fix.",
      question:"A price changes but customers see the old one for ten minutes. Where was it cached, and what would you change first?"},
    T4:{s:3,tier:"reference",concept:"Reading a query plan",
      citation:"database-indexing.doc.md",
      teach:"[Reference · 15m] Recognise it, answer in one sentence: sequential scan, index scan, and what a row estimate is for.",
      question:"The plan shows a sequential scan on a large table. Name one reason the planner might be right."}
  },
  practice:{
    P1:{s:1,label:"Placeholder · one page on the two core topics",portfolio:true,
      desc:"One page, in your own words, covering both stage-1 topics. Write it after the teaching, not during. If a sentence needs the corpus open in front of you, it is not yours yet."},
    P2:{s:2,label:"Placeholder · the load-bearing answer, written out",portfolio:false,
      desc:"Write the answer to the question this role screens for as you would say it: a few sentences, the failure case volunteered, no overclaiming. Then say it out loud twice."},
    P3:{s:3,label:"Placeholder · the question bank, answered cold",portfolio:true,
      desc:"Answer every question in the bank with nothing open, mark each one honestly, and rewrite the two worst answers."}
  },
  checks:{
    C1:{s:2,label:"Check 1 · Explain both core topics without notes",
      desc:"Both stage-1 topics, explained cold, including one thing each of them cannot do. Falling short is a signal to repeat the topic, not to push on."},
    C2:{s:3,label:"Check 2 · The bank, cold",
      desc:"Answer the question bank with nothing open. \"I don't know, but here is how I'd find out\" counts; a confident wrong answer does not."}
  },
  questions:[
    {q:"Placeholder — what does Cache-Control: max-age actually let a client do?",
     a:"Serve the stored copy without asking the server again until it expires. After that it revalidates rather than blindly refetching, when it has a validator.",
     where:"http-caching.doc.md"},
    {q:"Placeholder — when does an index on (a, b) stop helping?",
     a:"When the query does not constrain a, or when it needs a different sort order than the index provides. Every index also costs something on every write.",
     where:"database-indexing.doc.md"},
    {q:"Placeholder — describe a caching bug you would expect to see in production.",
     a:"A stale read after a write, because the write path did not invalidate what the read path had stored. Name the failure before the fix.",
     where:"http-caching.doc.md"},
    {q:"Placeholder — how would you decide whether a slow query needs an index?",
     a:"Read the plan first. An index is one answer among several, and the plan says whether the cost is the scan, the sort, or the row estimate being wrong.",
     where:"database-indexing.doc.md"}
  ],
  /* Your own claims, in your own words, with the boundary you will not cross.
   * Placeholder rows: replace each one with a line from your actual resume. */
  story:{
    claims:[
      {claim:"(placeholder) A line from your own resume goes here.",
       evidence:"Where its proof lives — a repository, a report, a paper, a shipped feature.",
       boundary:"What you would NOT claim about it if pushed."},
      {claim:"(placeholder) The line you would least like to be asked about.",
       evidence:"Do this one first. An undefended line is the one that costs you the interview.",
       boundary:"Say the limit out loud before the interviewer finds it."}
    ],
    numbers:[
      {metric:"(placeholder) A number you have used on your resume",value:"—",
       caveat:"Every number needs its caveat in the same breath.",source:"Where the number came from."}
    ],
    risks:[
      "(placeholder) The weakest part of your story. Name it before you are asked.",
      "(placeholder) The question you currently cannot answer. It belongs on the gap list."
    ]
  },
  sessions:[],
  /* ---- model registries. Not track content — carry these over verbatim. ----
   * Pinned exact model ids, deliberately NOT the CLI tier aliases: an alias can
   * quietly resolve to a previous-generation model. The bridge reports the model
   * that actually served each turn and replies are labelled with it, so a retired
   * or redirected id shows up on the first message rather than being guessed at. */
  claude:[
    {id:"claude-fable-5",    name:"Claude Fable 5 · most capable", short:"Fable 5"},
    {id:"claude-opus-5",     name:"Claude Opus 5 · deepest",       short:"Opus 5"},
    {id:"claude-sonnet-5",   name:"Claude Sonnet 5 · balanced",    short:"Sonnet 5"},
    {id:"claude-haiku-4-5",  name:"Claude Haiku 4.5 · fastest",    short:"Haiku 4.5"}
  ],
  codex:[
    {id:"gpt-5.6-sol",   name:"GPT-5.6 Sol · frontier",  short:"GPT-5.6 Sol"},
    {id:"gpt-5.6-terra", name:"GPT-5.6 Terra · balanced",short:"GPT-5.6 Terra"},
    {id:"gpt-5.6-luna",  name:"GPT-5.6 Luna · efficient",short:"GPT-5.6 Luna"}
  ]
};

/* =====================================================================
 *  STATE — layered on top of DATA. Private progress is persisted through the
 *  authenticated local bridge. localStorage holds preferences, and holds a
 *  copy of unsent work only while the bridge is unreachable.
 * ===================================================================== */
const PREF_KEY="prepwright_preferences_v1";

/* ---- live tutor provider + model config ----
 * The page talks only to the same-origin local bridge. The bridge invokes the
 * selected logged-in CLI and discloses the deliberately constructed tutoring
 * prompt to that provider; the browser never holds an API key.                */
const API="";                        // same origin (served by bridge.py)
const PROVIDERS=[
  {id:"claude",name:"Claude",short:"Claude"},
  {id:"codex", name:"Codex", short:"Codex"}
];
const DEFAULT_PROVIDER="claude";
/* The registries live on DATA so one object carries everything the page renders.
 * They are the only part of DATA that is not track content, and a regenerated
 * curriculum must carry them over unchanged. */
const PROVIDER_MODELS={claude:DATA.claude,codex:DATA.codex};
// Fable is opt-in; the default stays Claude Opus.
const DEFAULT_MODELS={claude:"claude-opus-5",codex:"gpt-5.6-sol"};
/* Superseded id -> current, so a pick saved in localStorage before a model
 * refresh does not keep sending a retired model forever.                       */
const MODEL_SUPERSEDED={
  "claude-opus-4-8":"claude-opus-5", "claude-opus-4-7":"claude-opus-5",
  "claude-opus-4-6":"claude-opus-5", "claude-sonnet-4-6":"claude-sonnet-5",
  "claude-haiku-4-5-20251001":"claude-haiku-4-5",
  "opus":"claude-opus-5", "sonnet":"claude-sonnet-5",
  "haiku":"claude-haiku-4-5", "fable":"claude-fable-5"
};
function currentProvider(id){ return PROVIDERS.some(x=>x.id===id)?id:DEFAULT_PROVIDER; }
function providerLabel(id){ const p=PROVIDERS.find(x=>x.id===id); return p?p.short:(id||"provider"); }
function modelsFor(provider){ return PROVIDER_MODELS[currentProvider(provider)]||[]; }
function currentModel(id,provider){
  const p=currentProvider(provider), m=(p==="claude"?(MODEL_SUPERSEDED[id]||id):id);
  return modelsFor(p).some(x=>x.id===m)?m:DEFAULT_MODELS[p];
}
function modelLabel(id){
  const m=Object.values(PROVIDER_MODELS).flat().find(x=>x.id===id);
  return m?m.short:(id||"tutor");
}
function activeProvider(){ return currentProvider(state&&state.provider); }
function activeModel(){ return currentModel(state&&state.model,activeProvider()); }
function isAssistantRole(role){ return role==="assistant"||role==="claude"; }
/* ---- reasoning effort -------------------------------------------------------
 * The bridge maps these shared levels to the selected provider's supported CLI
 * setting and reports what it actually applied.
 * Effort is NOT a price dial, and its cost is not monotonic: on a short factual
 * question a higher effort can produce a shorter, more decisive answer and bill
 * less than a low-effort ramble. The labels below therefore describe depth of
 * reasoning, never expense — a "max = expensive" label would be false.
 *
 * "Default" sends no flag at all, which is the behaviour the page has always had,
 * so it stays the default and nothing changes for anyone who never touches it.
 *
 * Stored per model: the right depth for Haiku is not the right depth for Opus, and
 * re-picking it on every model switch would be tedious.                          */
const EFFORTS=[
  {id:"",       name:"Default",  short:"default", hint:"No flag sent — the CLI's own default"},
  {id:"low",    name:"Low",      short:"low",     hint:"Answers fast, reasons little, tends to ramble"},
  {id:"medium", name:"Medium",   short:"medium",  hint:"Middle of the range"},
  {id:"high",   name:"High",     short:"high",    hint:"Reasons before answering; usually terser and sharper"},
  {id:"xhigh",  name:"Extra high",short:"xhigh",  hint:"For hard reasoning"},
  {id:"max",    name:"Max",      short:"max",     hint:"Deepest reasoning the model offers"}
];
const EFFORT_IDS=EFFORTS.map(e=>e.id);
function effortFor(model){
  const v=((state.effort||{})[model||""]);
  return EFFORT_IDS.indexOf(v)>=0?v:"";
}
function setEffortFor(model,level){
  state.effort=state.effort||{};
  state.effort[model]=EFFORT_IDS.indexOf(level)>=0?level:"";
  save();
}
function effortLabel(v){ const e=EFFORTS.find(x=>x.id===(v||"")); return e?e.short:(v||"default"); }
let bridgeOnline=false;              // selected provider availability, set by pingBridge()
let bridgeUp=false;                  // the bridge process itself answered /api/health
let bridgeSession=true;              // ...and it still accepts THIS page's cookie
let staleSessionWarned=false;
let bridgeProviders={};              // provider id -> boolean or {available:boolean}
let pending={};                     // step key -> awaiting a reply
function providerAvailable(provider){
  const status=bridgeProviders[currentProvider(provider)];
  return (status&&typeof status==="object")?!!status.available:!!status;
}
function providerInstalled(provider){
  const status=bridgeProviders[currentProvider(provider)];
  return (status&&typeof status==="object")?!!status.installed:!!status;
}
/* Three different states, one word each, because they are not one problem: a
 * bridge that is down loses your notes, a provider CLI that is missing cannot be
 * fixed by restarting anything, and a CLI that is merely signed out needs one
 * login. Collapsing them into "Offline · run prep" sends you to the wrong fix
 * two times in three, so each says which one it is. */
function bridgeStatus(){
  const p=activeProvider(), name=providerLabel(p);
  if(!bridgeUp) return {cls:"off", label:"Offline · not saving",
    help:`Run the local bridge once, then reload this page. In any terminal:`, cmd:"prep"};
  if(!providerInstalled(p)) return {cls:"off", label:`Saved · no ${name} CLI`,
    help:`Progress is saving, but the ${name} CLI is not installed on this Mac, so its models cannot answer. Pick another provider above, or install it:`,
    cmd:(p==="codex"?"npm i -g @openai/codex":"npm i -g @anthropic-ai/claude-code")};
  if(!providerAvailable(p)) return {cls:"off", label:`Saved · ${name} signed out`,
    help:`Progress is saving, but the ${name} CLI is not logged in. Sign in, then reload this page:`,
    cmd:(p==="codex"?"codex login":"claude")};
  return {cls:"on", label:"Live · connected",
    help:`This box is answering through your logged-in ${name} CLI; the bounded tutoring prompt and relevant source excerpts are sent to that provider. The bridge runs from any directory with:`, cmd:"prep"};
}

function seedState(){
  const topics={}, practice={};
  Object.keys(DATA.topics).forEach(id=>topics[id]={done:false});
  Object.keys(DATA.practice).forEach(id=>practice[id]={status:"todo",notes:""});
  // A generated track starts empty. Any recap cards come from sessions you close.
  const recap={};
  const bank=[];
  DATA.sessions.forEach((s,si)=>(s.recap||[]).forEach((r,ri)=>{
    const id="s"+si+"q"+ri; bank.push({id,q:r.q,a:r.a,stage:s.title});
    recap[id]={got:0,missed:0};
  }));
  return {
    theme:null, topics, practice,
    qa:[], sessions:[], recap, recapBank:bank,
    questions:{}, checks:{}, stepLog:{}, lastView:"continue",
    provider:DEFAULT_PROVIDER,
    model:DEFAULT_MODELS[DEFAULT_PROVIDER],
    models:Object.assign({},DEFAULT_MODELS),
    // model id -> effort level. "" means send no --effort flag.
    effort:{},
    // Re-check results: assess = key -> {mastery,reason,at} feeding stepScore();
    // assessList = the last run's rows, kept only to redraw the side panel.
    assess:{}, assessList:[], assessAt:0, assessCost:""
  };
}


/* Declared above the load() call below. These were once declared with
 * the rest of the persistence block below and load() assigned them from inside a
 * try/catch: every assignment threw ReferenceError before initialisation and the
 * catch ate it, so carried and pending work was read and silently dropped. */
const PENDING_KEY="prepwright_pending_v1";
/* Rail collapse is deliberately NOT on `state`: `state` is mirrored to disk by
 * pushState, and a sidebar toggle has no business bumping the progress revision
 * or travelling to the phone. It rides in the localStorage prefs blob next to
 * theme, which is per-browser by nature. Declared here so loadState() can set it
 * before the toggle is wired. */
let railHidden=false;
let sideHidden=false;
let pendingState=null;    // work saved while the bridge was unreachable

let state=load();
/* merge-forward: keep saved progress, but make sure ids added to DATA since the
 * save exist, so a curriculum update never blanks a restored file.            */
function hydrate(s){
  const base=seedState();
  const provider=currentProvider(s.provider);
  const models=Object.assign({},base.models,s.models||{});
  // A save with no `models` map: seed the Claude slot from its `model` field.
  if(!s.models||!s.models.claude) models.claude=currentModel(s.model,"claude");
  models.claude=currentModel(models.claude,"claude");
  models.codex=currentModel(models.codex,"codex");
  return Object.assign(base,s,{
    topics:Object.assign(base.topics,s.topics||{}),
    practice:Object.assign(base.practice,s.practice||{}),
    recap:Object.assign(base.recap,s.recap||{}),
    recapBank:(s.recapBank&&s.recapBank.length)?s.recapBank:base.recapBank,
    assess:Object.assign({},s.assess||{}),
    assessList:s.assessList||[],
    provider,
    models,
    model:models[provider]
  });
}
function load(){
  try{
    // The offline journal is parked here rather than adopted as the live state.
    // A browser holding a stale copy must not start the page from it and then
    // push that copy over a good disk file, so it is a merge candidate that
    // reconcileWithDisk() weighs against disk, never the starting truth.
    // It goes through the same shape check the Import button uses: it is
    // same-origin data, but it reaches Object.assign in mergeStates(), and a
    // "__proto__" key there is prototype pollution.
    const carry=k=>{
      try{
        const raw=localStorage.getItem(k); if(!raw) return null;
        const o=JSON.parse(raw);
        if(!o||Array.isArray(o)||typeof o!=="object"||!safeImportTree(o)) return null;
        return o;
      }catch(e){ return null; }
    };
    pendingState=carry(PENDING_KEY);
    const prefs=JSON.parse(localStorage.getItem(PREF_KEY)||"{}");
    railHidden=!!prefs.railHidden;
    sideHidden=!!prefs.sideHidden;
    return hydrate(Object.assign(seedState(),{
      theme:prefs.theme||null,lastView:prefs.lastView||"continue",
      provider:prefs.provider||DEFAULT_PROVIDER,
      models:prefs.models||Object.assign({},DEFAULT_MODELS),
      model:prefs.model||DEFAULT_MODELS[DEFAULT_PROVIDER],effort:prefs.effort||{}
    }));
  }catch(e){ return seedState(); }
}
/* ---- persistence ----------------------------------------------------------
 * The bridge writes into one SQLite database per track, under ~/.prepwright,
 * in 0600 files inside 0700 directories. That store is the record; localStorage
 * normally holds only UI and model preferences.
 * One deliberate exception: while the bridge is unreachable this tab is the only
 * holder of whatever is typed, and a closed lid would end it. In that window the
 * state, chat text included, is parked under PENDING_KEY and erased the moment
 * the bridge accepts it. The trade is explicit: a browser profile is a weaker
 * store than a 0600 file, and losing the session outright is worse.
 *
 * THIS PAGE SENDS CHANGES, NEVER THE DOCUMENT. `ackState` is the last document
 * the bridge acknowledged; every push is the difference between it and `state`,
 * as one op per appended chat turn and one op per changed mark. A tab holding a
 * stale copy therefore cannot express a deletion: there is no op that removes
 * anything. That is why the old whole-document write, its revision hash and its
 * heuristic shrink-detector are all gone.                                     */
const SYNC_DEBOUNCE_MS=250;
let syncTimer=null, syncState="idle";   // idle | pending | saving | saved | error
let ackState=null;        // the document the bridge has confirmed it holds
let diskRevision=null;
let trackId=null;
/* field -> [mark kind, container], served by the bridge from
 * prepwright/pagestate.py so the mapping has one source and not two. Until the
 * first GET answers, this page knows of no persisted field and pushes nothing,
 * which is the correct behaviour for a page that has not read disk yet. */
let fieldMap={};

/* 64 bits, as two 32-bit FNV-1a passes with different offset bases. An op id is
 * a UNIQUE key in the store, so a collision would silently drop one change; 32
 * bits is not enough room for that and SubtleCrypto is async, which a diff on
 * the save path cannot be. */
function h64(str){
  let a=0x811c9dc5, b=0x01000193;
  for(let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    a=Math.imul(a^c,16777619)>>>0;
    b=Math.imul(b^c,2166136261)>>>0;
  }
  return (a>>>0).toString(16).padStart(8,"0")+(b>>>0).toString(16).padStart(8,"0");
}
/* Stable JSON: key order must not change a hash, or the same value re-sent
 * after a reload mints a second op id and writes a duplicate row. */
function stableJSON(v){
  if(v===null||typeof v!=="object") return JSON.stringify(v);
  if(Array.isArray(v)) return "["+v.map(stableJSON).join(",")+"]";
  return "{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+stableJSON(v[k])).join(",")+"}";
}
/* The key an item in a list-shaped field is stored under. Matches the rule the
 * bridge uses when it imports a legacy document, so the same item imported and
 * then re-sent is one row and not two. */
function itemKey(item){
  const id=item&&item.id;
  return (id!=null&&String(id))||h64(stableJSON(item));
}
/* Deterministic, so a POST retried after a dropped connection is a no-op. The
 * base revision is in the id because a value that changes back to what it was,
 * across two different saves, is a real second change and needs its own row. */
function markOpId(kind,key,value,base){
  return "m."+h64(kind+"\u0000"+key+"\u0000"+stableJSON(value))+"."+String(base||"0").slice(0,8);
}
function turnOpId(step,index,entry){
  return "t."+h64(step+"\u0000"+index+"\u0000"+String(entry&&entry.text||""));
}

/* A readable name for the step row the bridge creates on the first turn for a
 * key. Cosmetic in the store; the key itself is the identity. */
function stepTitleForKey(key){
  const bits=String(key).split(":");
  try{
    const m=stepMeta({type:bits[1],id:bits[2]});
    if(m&&m.title) return String(m.title).slice(0,160);
  }catch(e){}
  return String(key).slice(0,160);
}

/* Everything in `cur` that `ack` does not have. Marks by key, chat by position:
 * a step log only ever grows, so entries past ack's length are the new ones. */
function computeOps(cur,ack,base){
  const ops=[]; ack=ack||{};
  Object.keys(fieldMap).forEach(field=>{
    const spec=fieldMap[field]; if(!spec) return;
    const kind=spec[0], container=spec[1];
    const c=cur[field], a=ack[field];
    if(container==="scalar"){
      if(c===undefined) return;
      if(stableJSON(c)!==stableJSON(a===undefined?null:a))
        ops.push({op:"mark",kind:"pref",key:field,value:c,
                  id:markOpId("pref",field,c,base)});
    }else if(container==="map"){
      const co=(c&&typeof c==="object")?c:{}, ao=(a&&typeof a==="object")?a:{};
      Object.keys(co).forEach(k=>{
        if(stableJSON(co[k])!==stableJSON(ao[k]===undefined?null:ao[k]))
          ops.push({op:"mark",kind,key:String(k).slice(0,200),value:co[k],
                    id:markOpId(kind,String(k),co[k],base)});
      });
    }else{
      const ca=Array.isArray(c)?c:[], aa=Array.isArray(a)?a:[];
      const seen=new Set(aa.map(itemKey));
      ca.forEach(item=>{
        if(!item||typeof item!=="object") return;
        const k=itemKey(item); if(seen.has(k)) return;
        seen.add(k);
        ops.push({op:"mark",kind,key:String(k).slice(0,200),value:item,
                  id:markOpId(kind,String(k),item,base)});
      });
    }
  });
  const cl=(cur.stepLog&&typeof cur.stepLog==="object")?cur.stepLog:{};
  const al=(ack.stepLog&&typeof ack.stepLog==="object")?ack.stepLog:{};
  Object.keys(cl).forEach(step=>{
    const c=Array.isArray(cl[step])?cl[step]:[];
    const a=Array.isArray(al[step])?al[step]:[];
    for(let i=a.length;i<c.length;i++){
      const e=c[i]; if(!e||typeof e!=="object") continue;
      const meta={};
      Object.keys(e).forEach(k=>{ if(k!=="role"&&k!=="text") meta[k]=e[k]; });
      ops.push({op:"turn",id:turnOpId(step,i,e),step:step,
                title:stepTitleForKey(step),
                pageRole:String(e.role||"sys"),
                text:String(e.text==null?"":e.text),
                meta:Object.keys(meta).length?meta:null});
    }
  });
  return ops;
}
/* Nothing may reach disk before the page has read what is already there. With
 * deltas an early push can no longer overwrite anything, but it would still
 * diff against an ack of null and re-send a seeded document as if it were work,
 * so the guard stands.                                                         */
let reconciled=false;

/* Total tutor messages held. The one number that says how much work a state is
 * carrying, and the one that must never go backwards. */
function chatVolume(s){
  let n=0; const sl=(s&&s.stepLog)||{};
  Object.keys(sl).forEach(k=>{ n+=((sl[k])||[]).length; });
  return n;
}

/* Union, never replace. Used for both the legacy migration and the offline
 * replay, so neither path can subtract. Longer chat log wins per step; a done
 * mark set anywhere stays set; entries with ids are unioned by id. */
function mergeStates(base,extra){
  if(!extra||typeof extra!=="object") return base;
  const out=Object.assign({},base);
  const sl=Object.assign({},base.stepLog||{});
  Object.keys(extra.stepLog||{}).forEach(k=>{
    const a=sl[k]||[], b=extra.stepLog[k]||[];
    if(b.length>a.length) sl[k]=b;
  });
  out.stepLog=sl;
  out.topics=Object.assign({},base.topics||{});
  Object.keys(extra.topics||{}).forEach(k=>{
    if((extra.topics[k]||{}).done) out.topics[k]=Object.assign({},out.topics[k]||{},{done:true});
  });
  out.practice=Object.assign({},base.practice||{});
  Object.keys(extra.practice||{}).forEach(k=>{
    const e=extra.practice[k]||{}, c=out.practice[k]||{};
    if(e.status&&e.status!=="todo"&&(!c.status||c.status==="todo")) c.status=e.status;
    if(e.notes&&!c.notes) c.notes=e.notes;
    out.practice[k]=c;
  });
  ["qa","sessions"].forEach(f=>{
    const seen=new Set((base[f]||[]).map(x=>x&&x.id));
    out[f]=(base[f]||[]).concat((extra[f]||[]).filter(x=>x&&!seen.has(x.id)));
  });
  /* `extra` is the newer side at every call site, so it wins a key both hold.
   * With `base` last, a check retaken offline, a question re-graded offline and
   * a fresh grade were all silently rolled back to the disk copy on the next
   * reconciliation. */
  out.checks=Object.assign({},base.checks||{},extra.checks||{});
  out.questions=Object.assign({},base.questions||{},extra.questions||{});
  out.assess=Object.assign({},base.assess||{},extra.assess||{});
  /* Recap cards and their drill counters are work too. Without this they
   * survived only from `base`, so every card banked while the bridge was down
   * disappeared the moment it came back. Unioned by question text, because the
   * ids are minted per device and would otherwise duplicate. */
  const seen=new Set((base.recapBank||[]).map(c=>String(c&&c.q||"").trim().toLowerCase()));
  out.recapBank=(base.recapBank||[]).concat(
    (extra.recapBank||[]).filter(c=>{
      const q=String(c&&c.q||"").trim().toLowerCase();
      if(!q||seen.has(q)) return false;
      seen.add(q); return true;
    }));
  out.recap=Object.assign({},base.recap||{});
  Object.keys(extra.recap||{}).forEach(id=>{
    const a=out.recap[id]||{got:0,missed:0}, b=extra.recap[id]||{};
    out.recap[id]={got:Math.max(a.got||0,b.got||0),missed:Math.max(a.missed||0,b.missed||0)};
  });
  return out;
}

/* The tab is the only holder of this work until the bridge takes it. Park it in
 * browser storage so a reload, a crash or a closed laptop does not end it. */
function stashPending(){
  try{ localStorage.setItem(PENDING_KEY,JSON.stringify(state)); }catch(e){}
}
function clearPending(){
  pendingState=null;
  try{ localStorage.removeItem(PENDING_KEY); }catch(e){}
}

function savePrefs(){
  const prefs={theme:state.theme,lastView:state.lastView,provider:activeProvider(),
    model:activeModel(),models:state.models||{},effort:state.effort||{},
    railHidden:railHidden,sideHidden:sideHidden};
  try{ localStorage.setItem(PREF_KEY,JSON.stringify(prefs)); }catch(e){}
}

function setSync(s){
  if(syncState===s) return;
  syncState=s;
  const el=document.getElementById("syncPill");
  if(el) paintSync(el);
}
function paintSync(el){
  const map={
    idle  :["",              ""],
    pending:["Saving…",      "warn"],
    saving:["Saving…",       "warn"],
    saved :["Saved to disk", "ok"],
    error :["Not saved",     "bad"]
  };
  const [txt,cls]=map[syncState]||map.idle;
  el.textContent=txt; el.className="syncpill "+cls; el.hidden=!txt;
}

function save(){
  /* savedAt is no longer stamped here. The bridge derives it from the newest
   * row it holds, and a client clock written into a field the store owns is
   * how a stale tab used to win a tie-break it should have lost. */
  savePrefs();
  setSync("pending");
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushState,SYNC_DEBOUNCE_MS);
}

/* How much real work a state holds. Used to stop an untouched page from
 * overwriting a good save. The test is "more than a fresh seed", and a fresh
 * seed for a newly generated track is genuinely empty.                       */
function progressWeight(s){
  if(!s||typeof s!=="object") return 0;
  let n=0;
  const sl=s.stepLog||{};
  Object.keys(sl).forEach(k=>{ n+=((sl[k])||[]).length; });
  n+=((s.qa||[]).length)+((s.sessions||[]).length)+Object.keys(s.questions||{}).length;
  Object.keys(s.practice||{}).forEach(k=>{
    const h=s.practice[k]; if(h&&h.status&&h.status!=="todo") n++;
    if(h&&h.notes) n++;
  });
  Object.keys(s.topics||{}).forEach(k=>{ if((s.topics[k]||{}).done) n++; });
  Object.keys(s.checks||{}).forEach(()=>n++);
  return n;
}

/* Fold what the bridge holds into this tab, and treat the result as
 * acknowledged. Union only, in both directions, so neither side subtracts. */
function adoptFromBridge(d){
  if(d.fields && typeof d.fields==="object") fieldMap=d.fields;
  if(d.trackId) trackId=d.trackId;
  diskRevision=d.revision||null;
  if(d.state && typeof d.state==="object"){
    state=hydrate(mergeStates(hydrate(d.state),state));
    /* ack is what the bridge confirmed, NOT the merged result: anything this
     * tab added on top is still unsent and must show up in the next diff. */
    ackState=JSON.parse(JSON.stringify(d.state));
    savePrefs();
    render(currentView(),{silent:true,keepScroll:true});
  }
}

async function pushState(opts){
  opts=opts||{};
  // Never write before reconcileWithDisk() has run. Anything typed in that
  // window is held, not lost: reconcile pushes once it knows what disk holds.
  if(!reconciled && !opts.reconciling){ stashPending(); return false; }
  const ops=computeOps(state,ackState,diskRevision);
  if(!ops.length){ setSync("saved"); return true; }
  const sending=JSON.parse(JSON.stringify(state));
  setSync("saving");
  /* Sent in slices, because one import or one first push of a long transcript
   * can carry more changes than the bridge accepts in a single write. Each
   * slice takes the revision the last one returned, so no slice after the first
   * arrives stale. Every op is idempotent, so a slice that fails half way is
   * re-sent whole on the next save without duplicating what landed. */
  /* Sliced by BYTES, with a count cap behind it. Slicing on count alone was
   * wrong: 400 turns at the 8 KiB turn cap is 3.1 MiB, over the bridge's 2 MiB
   * limit on one delta, so a long offline session produced a slice that was
   * refused every time it was retried and never got saved at all. */
  const SLICE_OPS=400, SLICE_BYTES=1048576;
  /* The budget is bytes, so it must be measured in bytes. String.length counts
   * UTF-16 code units: one CJK character is 1 there and 3 in UTF-8, one emoji
   * is 2 and 4. Measuring the budget in code units lets the page build a slice
   * three times the size it believes, which the bridge then refuses on every
   * retry, so the work never saves. TextEncoder is the exact measure the
   * bridge applies on the other side. */
  const BYTES = (typeof TextEncoder === "function")
    ? (s => new TextEncoder().encode(s).length)
    : (s => unescape(encodeURIComponent(s)).length);
  try{
    for(let at=0; at<ops.length; ){
      let end=at, bytes=0;
      while(end<ops.length && end-at<SLICE_OPS){
        const size=BYTES(JSON.stringify(ops[end]));
        if(end>at && bytes+size>SLICE_BYTES) break;   // never emit an empty slice
        bytes+=size; end++;
      }
      const slice=ops.slice(at,end);
      const last=end>=ops.length;
      const body=JSON.stringify({trackId,revision:diskRevision,
        intent:opts.intent||"update",ops:slice});
      const r=await fetch(API+"/api/state",{
        method:"POST",
        headers:{"content-type":"application/json","x-tutor-bridge":"1"},
        body,
        keepalive:!!opts.keepalive
      });
      let d={}; try{ d=await r.json(); }catch(_){}
      const outcome=await applySliceReply(r,d,last,sending,opts);
      if(outcome!=="continue") return outcome;
      at=end;
    }
    return true;
  }catch(e){
    // The bridge is unreachable. This tab is now the only holder of the work.
    stashPending();
    setSync("error"); return false;
  }
}

/* One slice's reply. Returns "continue" when the loop should send the next
 * slice, or the value pushState itself should return. */
async function applySliceReply(r,d,last,sending,opts){
    if(r.status===409){
      // Nothing was applied. The bridge hands back what it really holds, so
      // fold that in and send the difference again rather than stranding this
      // tab on a document the store has moved past.
      if(d.regression && d.state){
        adoptFromBridge(d);
        toast("Merged with the saved copy on disk");
        // Carry the caller's intent and keepalive through the retry. Dropping
        // intent turned a refused "replace" into a silent "update", so the
        // designed 409 refusal became cosmetic: the bulk write it exists to
        // stop was folded in on the very next request. Dropping keepalive
        // cancelled a close-time flush at unload, which is the one moment the
        // flag exists for.
        return await pushState({intent:opts.intent,keepalive:opts.keepalive,
                                reconciling:!reconciled});
      }
      stashPending();
      setSync("error");
      toast(d.error||"Progress changed in another tab — reload before saving");
      return false;
    }
    if(!r.ok){
      stashPending();
      setSync("error");
      toast(d.error||("Not saved — HTTP "+r.status));
      return false;
    }
    if(d.trackId) trackId=d.trackId;
    diskRevision=d.revision||null;
    if(d.stale && d.state){
      // Another writer had moved the store on. The ops still applied, because
      // every one of them is an append; this folds in what they added.
      adoptFromBridge(d);
    }
    if(!last) return "continue";
    /* Every op landed, so what was sent is now acknowledged. `sending` and not
     * `state`: the page may have changed under the awaits, and claiming those
     * unsent edits were stored would drop them from the next diff. */
    ackState=sending;
    clearPending();          // it is in the store now; the browser copy is redundant
    setSync("saved"); return true;
}

/* Last-ditch flush when the tab closes inside the debounce window. keepalive is
 * capped near 64KB, so this can fail on a long transcript; that is survivable
 * because reconcileWithDisk() re-pushes on the next load.                      */
function flushOnExit(){
  if(syncState==="pending"||syncState==="saving"||syncState==="error"){
    clearTimeout(syncTimer);
    pushState({keepalive:true});
  }
}
window.addEventListener("pagehide",flushOnExit);
window.addEventListener("beforeunload",flushOnExit);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushOnExit(); });

/* On start, reconcile whatever this browser is carrying with private disk state. */
async function reconcileWithDisk(){
  let disk=null, response={};
  try{
    const r=await fetch(API+"/api/state",{
      cache:"no-store",headers:{"x-tutor-bridge":"1"}
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    response=await r.json(); disk=response.state||null;
    diskRevision=response.revision||null;
    trackId=response.trackId||null;
    /* The field map has to arrive before the first diff runs, or this page
     * pushes nothing and the first save looks like it worked. */
    if(response.fields && typeof response.fields==="object") fieldMap=response.fields;
  }catch(e){
    // No bridge. Adopt whatever this browser was carrying so the session is not
    // blank, keep it stashed, and leave reconciled=false so nothing is written
    // blind. pushState() will hold every save until a bridge answers.
    const carried=mergeStates(state,pendingState||{});
    if(chatVolume(carried)>chatVolume(state)||progressWeight(carried)>progressWeight(state)){
      state=hydrate(carried);
      render(currentView(),{silent:true,keepScroll:true});
    }
    stashPending();
    setSync("error");
    toast("Bridge offline — progress is held in this browser until it returns");
    return;
  }

  // Fold in any work saved while the bridge was down. Union only, so it cannot
  // subtract from what is already stored.
  let local=state;
  if(pendingState) local=mergeStates(local,pendingState);

  if(!disk){
    // Nothing stored for this track yet, so this whole document is the delta.
    state=hydrate(local);
    ackState=null;
    reconciled=true;
    await pushState({reconciling:true});
    render(currentView(),{silent:true,keepScroll:true});
    return;
  }

  // Disk is the record. The page only ever adds to it. Merging both directions
  // makes the outcome independent of which clock is ahead: without it a stale
  // tab used to win purely on a fresher savedAt, and real work disappeared.
  const merged=mergeStates(hydrate(disk),local);
  const adopted=chatVolume(merged)>chatVolume(local)
             || progressWeight(merged)>progressWeight(local);
  state=hydrate(merged);
  /* ack is the raw document the bridge served, before hydrate's seed defaults
   * and before anything this browser was carrying. Everything those two added
   * is genuinely unsent, and the next diff is what sends it. */
  ackState=JSON.parse(JSON.stringify(disk));
  savePrefs();
  reconciled=true;
  render(currentView(),{silent:true,keepScroll:true});
  if(computeOps(state,ackState,diskRevision).length){
    await pushState({reconciling:true});
  }else{
    // Nothing of ours to add: the store already holds everything.
    clearPending();
    setSync("saved");
  }
  if(adopted) toast("Restored your progress from disk");
}

/* progress calculations */
function practiceCount(){ return Object.keys(DATA.practice).length; }
function checkCount(){ return Object.keys(DATA.checks).length; }
function practiceDone(){ return Object.values(state.practice).filter(h=>h.status==="done").length; }
function topicsDone(){ return Object.values(state.topics).filter(t=>t.done).length; }
function checksPassed(){ return Object.values(state.checks).filter(c=>c&&c.result==="pass").length; }
function stageStatus(n){
  const steps=stageSteps(n);
  if(!steps.length) return "todo";
  if(steps.every(stepDone)) return "done";
  if(steps.some(stepDone)) return "doing";
  const anyOpen=Object.entries(DATA.practice).some(([id,h])=>h.s===n&&
    ["doing","outstanding"].indexOf((state.practice[id]||{}).status)>=0);
  return anyOpen?"doing":"todo";
}

/* ---- Continue: stage-step model ------------------------------------------
 * A stage owns whatever topics, practice and checks name it, so a track can be
 * three stages or fifteen and nothing here changes. Step keys are the contract
 * with the bridge: <stage>:topic|practice|check:<id>. */
function stageSteps(n){
  const steps=[];
  /* `k.key||mint` is the whole difference between a placeholder track and a real
   * one. The page used to mint every step key from a stage number and a local
   * id. A curriculum written by the bridge already HAS a key -- the same string
   * `curriculum.step_key` minted and `/api/chat` validates -- and minting a
   * second one here would produce a key no pinned slice answers to, which is a
   * teaching turn with an empty pack. Adopted topics carry `key`; the
   * placeholder track does not, and mints exactly as before. */
  const mint=(t,type,id)=>(t&&t.key)?String(t.key):(n+":"+type+":"+id);
  Object.entries(DATA.topics).filter(([,t])=>t.s===n).forEach(([id,t])=>steps.push({key:mint(t,"topic",id),type:"topic",id,stage:n}));
  Object.entries(DATA.practice).filter(([,h])=>h.s===n).forEach(([id,h])=>steps.push({key:mint(h,"practice",id),type:"practice",id,stage:n}));
  Object.entries(DATA.checks).filter(([,c])=>c.s===n).forEach(([id,c])=>steps.push({key:mint(c,"check",id),type:"check",id,stage:n}));
  return steps;
}
function stepDone(s){
  if(s.type==="topic") return !!(state.topics[s.id]&&state.topics[s.id].done);
  if(s.type==="practice") return !!(state.practice[s.id]&&state.practice[s.id].status==="done");
  return !!(state.checks[s.id]&&(state.checks[s.id].result==="pass"||state.checks[s.id].result==="retaken"));
}
function stageComplete(n){ const st=stageSteps(n); return st.length>0&&st.every(stepDone); }
function firstStageNum(){ return DATA.stages.length?DATA.stages[0].n:1; }
function lastStageNum(){ return DATA.stages.length?DATA.stages[DATA.stages.length-1].n:1; }
function currentStageNum(){ for(const st of DATA.stages){ if(!stageComplete(st.n)) return st.n; } return lastStageNum(); }

/* ---- progress = delivery against the step's task ---------------------------
 * Progress measures how much of the DEFINED TASK each step got, and nothing
 * else. Talking is not delivering: much of the chat on any step is side
 * questions asked in whichever box happened to be open, and counting turns
 * would score all of that as progress on the wrong topic.
 *
 * Two sources only, highest first:
 *   delivered   1.00  your own tick, nothing overrides it
 *   assessed    0-1   Re-check, which reads the transcript against the task
 *
 * Chat activity contributes ZERO to the percentage. It only lights the step up
 * as touched, so you can see where you have been without it flattering you. */
/* ---- reading a step's transcript across curriculum re-cuts ------------------
 * A step key embeds its stage ("2:topic:T6"), so moving a topic to a different
 * stage would strand its chat log under the old key. Re-cuts happen: the gap
 * list gets re-approved, the curriculum is rebuilt, and a topic lands somewhere
 * else with the same id.
 *
 * Reads therefore merge the canonical key with any surviving key for the same
 * step id; writes only ever go to the canonical one. Nothing is moved, copied
 * or rewritten on disk, so the bridge's shrink guard is untouched, no message
 * is duplicated, and the spend totals still count each stored log exactly once. */
function stepAliasKeys(key){
  const m=/^(\d{1,2}):(topic|practice|check):([A-Za-z0-9]+)$/.exec(String(key||""));
  if(!m) return [];
  const suffix=":"+m[2]+":"+m[3];
  return Object.keys(state.stepLog||{}).filter(k=>k!==key&&k.endsWith(suffix)&&/^\d{1,2}:/.test(k));
}
function stepLogOf(key){
  const own=(state.stepLog&&state.stepLog[key])||[];
  const alias=stepAliasKeys(key);
  if(!alias.length) return own;
  const merged=alias.reduce((a,k)=>a.concat(state.stepLog[k]||[]),[]).concat(own);
  return merged.slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
}
function stepEvidence(key){
  const log=stepLogOf(key);
  let mine=0,tutor=0,chars=0;
  log.forEach(e=>{
    const r=e.role||"me";
    if(isAssistantRole(r)) tutor++;
    else if(r==="me"){ mine++; chars+=(e.text||"").length; }
  });
  return {mine,tutor,chars};
}
function stepTouched(key){ return stepEvidence(key).mine>0; }
function stepScore(s){
  if(stepDone(s)) return 1;
  const a=(state.assess||{})[s.key];
  if(a&&typeof a.mastery==="number") return Math.max(0,Math.min(1,a.mastery));
  return 0;   // unassessed chat is not progress, however much of it there is
}
/* Has this step been graded, or is its 0 just "not looked at yet"? The side
 * list needs to tell those apart or an ungraded step looks like a failed one. */
function stepGraded(s){ return !!((state.assess||{})[s.key]); }
function pctOf(steps){ return steps.length?Math.round(steps.reduce((a,s)=>a+stepScore(s),0)/steps.length*100):0; }
function trackPct(){ const all=[]; DATA.stages.forEach(st=>all.push(...stageSteps(st.n))); return pctOf(all); }
/* The key is minted by the curriculum and the id is chosen by the page, so the
 * two are not the same string and one cannot be parsed out of the other. A real
 * step key is "8:topic:S08" while the topic it names is keyed by its gap, g08:
 * parsing gave stepMeta an id that is not in DATA.topics, and every render site
 * that dereferences it threw. STEP_INDEX is the map adoptCurriculum builds while
 * it knows both; the parse stays as the fallback for the placeholder track,
 * which mints its own keys and for which parsing is correct. */
let STEP_INDEX={};
function stepFromKey(k){
  k=String(k||"");
  const known=STEP_INDEX[k];
  if(known) return {key:k,stage:known.stage,type:known.type,id:known.id};
  const p=k.split(":"); return {key:k,stage:+p[0],type:p[1],id:p[2]};
}
/* ---- tiers ------------------------------------------------------------------
 * core      = the small share that produces the answer you are actually asked for
 * depth     = real depth, worth time only once every core topic is delivered
 * reference = recognise it, answer in one sentence, never sit a whole session
 * Practice and checks inherit the strongest tier present in their stage, because
 * a practice piece is exactly as load-bearing as the topics that feed it.           */
const TIER_LABEL={core:"Core",depth:"Depth",reference:"Reference"};
const TIER_RANK={core:3,depth:2,reference:1};
function stageTier(n){
  let best="";
  Object.values(DATA.topics).forEach(t=>{
    if(t.s!==n) return;
    if(!best||(TIER_RANK[t.tier]||0)>(TIER_RANK[best]||0)) best=t.tier;
  });
  return best||"core";
}
function tierChip(tier){
  return tier?`<span class="tierchip tier-${esc(tier)}">${esc(TIER_LABEL[tier]||tier)}</span>`:"";
}
/* The core topics, in delivery order. Derived from DATA.topics rather than kept
 * as a second hand-written array, so it cannot drift from the curriculum. */
function coreSpine(){
  return Object.entries(DATA.topics)
    .filter(([,t])=>t.tier==="core")
    .map(([id,t])=>({id,s:t.s,concept:t.concept,key:t.key||(t.s+":topic:"+id)}))
    .sort((a,b)=>a.s-b.s||a.id.localeCompare(b.id));
}
function stepMeta(s){
  if(s.type==="topic"){ const t=DATA.topics[s.id];
    return {kind:"Topic "+s.id,title:t.concept,citation:t.citation||"",
      prompt:(t.citation?("Read "+t.citation+" in the corpus. "):"")+t.question,
      hint:t.teach,deliver:"I can explain this",tier:t.tier||"",res:t.res||[]}; }
  if(s.type==="practice"){ const h=DATA.practice[s.id];
    return {kind:"Practice "+s.id+(h.portfolio?" · portfolio piece":""),title:h.label,citation:"",
      prompt:h.desc,hint:"",deliver:"Mark practice delivered",tier:stageTier(h.s),res:[]}; }
  const c=DATA.checks[s.id];
  return {kind:"Check "+s.id,title:c.label,citation:"",prompt:c.desc,hint:"",
    deliver:"Mark check cleared",tier:stageTier(c.s),res:[]};
}
function setStepDone(s,done){
  if(s.type==="topic") state.topics[s.id].done=done;
  else if(s.type==="practice") state.practice[s.id].status=done?"done":"todo";
  else state.checks[s.id]=done?{result:"pass"}:{result:""};
  save();
}

/* opts.silent    — do not save; a render caused by adopting someone else's write
 *                  must not write back, or two tabs ping-pong storage events.
 * opts.keepScroll — leave the viewport alone; only deliberate navigation jumps
 *                   to the top, never a background sync.                       */
function render(view,opts){
  opts=opts||{};
  $$(".view").forEach(v=>v.classList.remove("active"));
  const el=$("#view-"+view); if(!el) return;
  el.classList.add("active");
  ({start:renderStart,continue:renderContinue,overview:renderOverview,stages:renderStages,curriculum:renderCurriculum,
    practice:renderPractice,sessions:renderSessions,qa:renderQA,recap:renderRecap,
    questions:renderQuestions,story:renderStory,sources:renderSources}[view])(el);
  $$("#nav .navlink").forEach(a=>a.classList.toggle("active",a.dataset.view===view));
  state.lastView=view;
  if(!opts.silent) save();
  const sp=document.getElementById("syncPill"); if(sp) paintSync(sp);  // pill is re-created by each render
  if(!opts.keepScroll){ $("#main").scrollTo?.(0,0); window.scrollTo(0,0); }
  paintToTop();   // a view change can shorten the page out from under the button
}

}
/* renderContinue replaces the whole view, and a reply arriving mid-sentence

function stageDonePanel(sn){

/* ---- live tutor chat (talks to the selected provider via bridge.py) ---- */
function requestStep(s){
  const m=stepMeta(s);
  return {
    key:String(s.key||"").slice(0,80),
    kind:String(m.kind||"").slice(0,120),
    title:String(m.title||"").slice(0,240),
    prompt:String(m.prompt||"").slice(0,1200)
  };
}
/* The bridge trims a conversation that exceeds its limits rather than refusing
 * it, and reports how many turns it left out. Sending the whole log anyway
 * would ship a step's entire history on every question for nothing, so the page
 * sends the newest turns that fit and lets the bridge trim further. */
const SEND_MAX_TURNS=48, SEND_MAX_CHARS=56000;
function buildMsgs(log){
  // map step-log roles to the two chat roles; `claude` is accepted as assistant
  const out=[];
  (log||[]).forEach(e=>{
    const savedRole=e.role||"me";
    const role=isAssistantRole(savedRole)?"assistant":(savedRole==="me"?"user":null);
    if(!role) return; // skip sys notes
    if(out.length && out[out.length-1].role===role) out[out.length-1].content+="\n\n"+e.text;
    else out.push({role,content:e.text});
  });
  const kept=[]; let chars=0;
  for(let i=out.length-1;i>=0;i--){
    const c=out[i].content||"";
    if(kept.length && (kept.length>=SEND_MAX_TURNS || chars+c.length>SEND_MAX_CHARS)) break;
    kept.push(out[i]); chars+=c.length;
  }
  kept.reverse();
  return kept;
}
function fmtReply(t){
  return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,"<br>");
}
function bubbleFor(e){
  const role=e.role||"me";
  if(role==="session") return sessionBubble(e);
  // Label with the model that actually served the turn when the bridge reports one.
  // An unrecognised id renders verbatim, so a redirect is visible instead of silent.
  // The effort shown is the one the bridge actually applied, echoed back, not the
  // one that was requested — an unrecognised level silently falls back in the CLI.
  if(isAssistantRole(role)) return `<div class="bubble assistant"><div class="who">Tutor · ${e.provider?esc(providerLabel(e.provider))+" · ":""}${esc(modelLabel(e.resolved||e.model))}${
    (e.effort&&e.effort!=="default")?" · thinking "+esc(e.effort):""} · ${esc(fmt(e.ts))}${
    e.usage?`<span class="usage">${esc(usageLabel(e.usage))}</span>`:""}</div>${fmtReply(e.text)}${groundingFor(e)}</div>`;
  if(role==="sys")    return `<div class="bubble sys"><div class="who">System</div>${esc(e.text).replace(/\n/g,"<br>")}</div>`;
  return `<div class="bubble me"><div class="who">You · ${esc(fmt(e.ts))}</div>${esc(e.text)}</div>`;
}
/* What the tutor was allowed to read, and anything it named that was not in it.
 *
 * Three states, and the middle one is the reason this exists.
 *   invented   the reply cited a section the pack did not contain. Shown as a
 *              warning, above the citation list, because a well-cited wrong
 *              lesson is more dangerous than an uncited one: it reads as
 *              checked.
 *   grounded   the reply ran against real pinned sections. The tokens are
 *              listed so a claim can be traced back to the section it came from.
 *   ungrounded the corpus was empty or the step had nothing pinned. The tutor
 *              was told to say so; this says so on the page as well, so a
 *              refusal reads as the system working rather than as a bad answer.
 *
 * Turns stored before this shipped carry none of these fields, so an entry with
 * no `cites` array and no `grounded` flag renders nothing rather than claiming
 * an old lesson was ungrounded. */
function groundingFor(e){
  if(!e || (!Array.isArray(e.cites) && e.grounded===undefined)) return "";
  const invented=Array.isArray(e.invented)?e.invented:[];
  const cited=Array.isArray(e.cited)?e.cited:[];
  const cites=Array.isArray(e.cites)?e.cites:[];
  let out="";
  if(invented.length){
    out+=`<div class="ground bad" role="alert"><b>Not in your sources.</b> This reply cited `
      +invented.map(c=>`<code>${esc(c)}</code>`).join(" ")
      +`, which ${invented.length===1?"was":"were"} not in the material it was given. Treat `
      +`${invented.length===1?"that claim":"those claims"} as unchecked.</div>`;
  }
  if(e.grounded===false && !invented.length){
    out+=`<div class="ground none">Nothing was pinned to this step, so the tutor had no sources to answer from.</div>`;
  }
  if(cites.length){
    out+=`<div class="ground ok"><span class="glabel">Read from</span> `
      +cites.map(c=>`<code class="${cited.indexOf(c)>=0?"used":""}">${esc(c)}</code>`).join(" ")
      +(e.packSha16?`<span class="gsha" title="the exact pack this answer was checked against">${esc(e.packSha16)}</span>`:"")
      +`</div>`;
  }
  return out;
}
function pushSys(key,msg){ state.stepLog=state.stepLog||{}; (state.stepLog[key]=state.stepLog[key]||[]).push({ts:Date.now(),role:"sys",text:msg}); }
/* Shown on every reply on purpose. Per-question input cost is the number most
 * likely to creep: a CLI that starts pulling in files from its working
 * directory, or a model left free to go reading them, can inflate it sharply
 * with nothing looking broken. Printing it is what keeps it honest, because a
 * regression shows up on the next reply instead of at the end of the month. */
function usageLabel(u){
  if(!u) return "";
  const k=n=>n>=1000?(n/1000).toFixed(1)+"k":String(n||0);
  return "· "+k(u.in)+" in / "+k(u.out)+" out"+(u.cached?" · "+k(u.cached)+" cached":"");
}
async function askTutor(key){
  const s=stepFromKey(key);
  pending[key]=true;
  if($("#view-continue").classList.contains("active")) renderContinue($("#view-continue"));
  const provider=activeProvider(), model=activeModel(), step=requestStep(s);
  // The citation goes over as its own field so the bridge can pull that exact
  // corpus document and hand it to a tool-less model, instead of parsing it back
  // out of prose. The field name is the bridge's contract — do not rename it.
  const body={provider,model,effort:effortFor(model),
              stepKey:step.key,step,
              citation:stepMeta(s).citation||"",
              messages:buildMsgs(stepLogOf(key))};
  try{
    const r=await fetch(API+"/api/chat",{method:"POST",
      headers:{"content-type":"application/json","x-tutor-bridge":"1"},
      body:JSON.stringify(body)});
    let d={}; try{ d=await r.json(); }catch(_){}
    if(!r.ok || d.error){ pushSys(key, (d.error||("Request failed — HTTP "+r.status))); bridgeOnline=(r.status!==0); }
    else{
      // grounded / cites / citations / packSha16 come back on every reply and
      // the page ignored all four. citations.invented is the list of tokens the
      // tutor named that the pack did not contain: a confident, well-cited,
      // wrong lesson, which is the exact failure this whole design exists to
      // prevent. Silence about it is complicity.
      // These ride through client_meta untouched (pagestate.py only reserves
      // text/seq/at), so they persist and survive a reload with no schema change.
      const cit=d.citations||{};
      (state.stepLog[key]=state.stepLog[key]||[]).push({ts:Date.now(),role:"assistant",provider:(d.provider||provider),model,resolved:(d.resolved||""),effort:(d.effort||""),usage:(d.usage||null),
        grounded:(d.grounded===true),
        cites:(Array.isArray(d.cites)?d.cites:[]),
        cited:(Array.isArray(cit.valid)?cit.valid:[]),
        invented:(Array.isArray(cit.invented)?cit.invented:[]),
        packSha16:(d.packSha16||""),
        text:(d.text||"(empty reply)")}); bridgeOnline=true; }
  }catch(e){
    bridgeOnline=false;
    pushSys(key, "Live tutor is offline. This message is held in this browser and goes to disk when the bridge returns. Open a terminal, run:\n  prep\nthen reload this page. Live chat uses the logged-in CLI for your selected provider.");
  }
  pending[key]=false; save();
  if($("#view-continue").classList.contains("active")) renderContinue($("#view-continue"));
}

/* ---- close the session ------------------------------------------------------
 * The end-of-session review could be a form: type what you covered, how the
 * explain-back went, and three recap questions. A review the tired student has
 * to write does not get written, and an empty recap drill teaches nothing.
 *
 * This reads the transcript back instead and drafts it. It runs on the cheap
 * model under a schema (same call shape as Re-check), the result lands in the
 * chat where the work happened, the recap cards go straight into the bank, and
 * a session entry appears in the log. You can delete any of it — it is a draft
 * that exists, not a form that does not.                                       */
let reviewing={};
const REVIEW_MIN_TURNS=4;
function reviewable(key){
  const log=stepLogOf(key);
  return log.filter(e=>(e.role||"me")==="me"||isAssistantRole(e.role)).length>=REVIEW_MIN_TURNS;
}
function mergeRecap(cards,label){
  state.recapBank=state.recapBank||[]; state.recap=state.recap||{};
  let added=0;
  (cards||[]).forEach((c,i)=>{
    const q=String(c.q||"").trim(); if(!q) return;
    // Same question twice teaches nothing and pollutes the weak list.
    if(state.recapBank.some(x=>String(x.q||"").trim().toLowerCase()===q.toLowerCase())) return;
    const id="r"+Date.now().toString(36)+i;
    state.recapBank.push({id,q,a:String(c.a||""),stage:label});
    state.recap[id]={got:0,missed:0};
    added++;
  });
  return added;
}
async function closeSession(key){
  const s=stepFromKey(key), m=stepMeta(s);
  if(!reviewable(key)){ toast("Not enough of a session to review yet"); return; }
  const provider=activeProvider();
  reviewing[key]=true; focusStepKey=key; renderContinue($("#view-continue"));
  try{
    const r=await fetch(API+"/api/review",{method:"POST",
      headers:{"content-type":"application/json","x-tutor-bridge":"1"},
      body:JSON.stringify({provider,stepKey:key,step:requestStep(s),
        messages:buildMsgs(stepLogOf(key))})});
    let d={}; try{ d=await r.json(); }catch(_){}
    if(!r.ok||d.error) throw new Error(d.error||("HTTP "+r.status));
    const label=m.kind+" · "+m.title;
    const added=mergeRecap(d.recap,label);
    (state.stepLog[key]=state.stepLog[key]||[]).push(
      {ts:Date.now(),role:"session",provider:(d.provider||provider),usage:(d.usage||null),session:d});
    state.sessions=state.sessions||[];
    state.sessions.push({
      id:"sess"+Date.now().toString(36),
      date:new Date().toISOString().slice(0,10),
      title:label,
      covered:d.covered||"",
      explainBack:[d.gotRight||"",d.slipped?("Slipped: "+d.slipped):""].filter(Boolean).join(" "),
      practice:"",
      next:d.next||"",
      redFlags:"",
      recap:(d.recap||[]).map(c=>({q:c.q,a:c.a})),
      stepKey:key
    });
    bridgeOnline=true;
    toast(added?("Session closed · "+added+" recap card"+(added===1?"":"s")+" added"):"Session closed · no new cards");
  }catch(e){
    const off=/Failed to fetch|NetworkError|load failed/i.test(String(e&&e.message));
    if(off) bridgeOnline=false;
    pushSys(key, off?"The session review needs the live bridge. Run `prep` in a terminal, then reload."
                    :("Session review failed: "+String(e&&e.message||e).slice(0,240)));
  }
  reviewing[key]=false; save(); renderContinue($("#view-continue")); refreshBadges();
}
function sessionBubble(e){
  const r=e.session||{}, cards=r.recap||[];
  return `<div class="bubble review"><div class="who">Session review · ${
    e.provider?esc(providerLabel(e.provider))+" · ":""}${esc(modelLabel(r.model))} · ${esc(fmt(e.ts))}${
    e.usage?`<span class="usage">${esc(usageLabel(e.usage))}</span>`:""}</div>
    <div class="revcard">
      <h4>What this session covered</h4>
      ${r.covered?`<div class="rb"><b>Covered</b>${esc(r.covered)}</div>`:""}
      ${r.gotRight?`<div class="rb"><b>You got right</b>${esc(r.gotRight)}</div>`:""}
      ${r.slipped?`<div class="rb"><b>What slipped</b>${esc(r.slipped)}</div>`:""}
      ${r.next?`<div class="rb"><b>Next</b>${esc(r.next)}</div>`:""}
      ${cards.length?`<div class="rb"><b>Added to the recap drill</b>${cards.map(c=>
        `<div class="recapq">${esc(c.q)}<div class="a">${esc(c.a)}</div></div>`).join("")}</div>`:""}
