/* ---- Re-check progress ------------------------------------------------------
 * Sends a digest, never the transcripts: for a grade, the last exchange plus a
 * turn count is what the judgement actually turns on, and shipping full logs for
 * every step at once would cost more than every chat turn that produced them.
 * Scoped to steps that have chat but no tick — a delivered step needs no grading
 * and an untouched one has nothing to read.                                     */
let assessing=false;
function assessCandidates(){
  const out=[];
  DATA.stages.forEach(st=>stageSteps(st.n).forEach(s=>{
    if(stepDone(s)) return;
    const log=stepLogOf(s.key);
    const mine=log.filter(e=>(e.role||"me")==="me");
    if(!mine.length) return;
    const m=stepMeta(s);
    const lastTutor=[...log].reverse().find(e=>isAssistantRole(e.role));
    out.push({
      key:s.key, title:m.title,
      // The task is what gets graded. Without it the grader falls back to
      // "did they seem engaged", which is exactly the wrong question.
      task:m.prompt||"",
      turns:log.length,
      // Three of the student's own messages, not just the last: the last one is
      // often a tangent, and a tangent is not evidence about the task.
      said:mine.slice(-3).map(e=>e.text||""),
      tutor:(lastTutor&&lastTutor.text)||""});
  }));
  return out;
}
async function recheckProgress(){
  if(assessing) return;
  const items=assessCandidates();
  if(!items.length){
    // Nothing to grade is not a failure: the local scores are already exact
    // when every step is either ticked or untouched.
    state.assessList=[]; state.assessAt=Date.now(); state.assessCost="nothing to grade";
    save(); renderContinue($("#view-continue"));
    toast("No steps in progress — the numbers are already exact"); return;
  }
  assessing=true; renderContinue($("#view-continue"));
  const provider=activeProvider();
  try{
    const r=await fetch(API+"/api/assess",{method:"POST",
      headers:{"content-type":"application/json","x-tutor-bridge":"1"},
      body:JSON.stringify({provider,steps:items})});
    let d={}; try{ d=await r.json(); }catch(_){}
    if(!r.ok||d.error) throw new Error(d.error||("HTTP "+r.status));
    const known=new Set(items.map(i=>i.key));
    const rows=(d.steps||[]).filter(x=>x&&known.has(x.key));   // ignore invented keys
    state.assess=state.assess||{};
    rows.forEach(x=>{ state.assess[x.key]={mastery:Math.max(0,Math.min(1,+x.mastery||0)),reason:x.reason||"",at:Date.now()}; });
    state.assessList=rows;
    state.assessAt=Date.now();
    const u=d.usage||{};
    state.assessCost=(u.in!=null)?(usageLabel(u).replace(/^· /,"")):"";
    bridgeOnline=true;
    toast(rows.length+" step"+(rows.length===1?"":"s")+" graded"+(d.capped?" ("+d.capped+" not graded)":""));
  }catch(e){
    // Say what actually broke. A blanket "bridge is offline" sent me looking at
    // the wrong thing when the real answer was in the response body.
    const off=/Failed to fetch|NetworkError|load failed/i.test(String(e&&e.message));
    if(off) bridgeOnline=false;
    toast(off?"Could not re-check — the bridge is offline. Run `prep` and try again."
             :("Re-check failed: "+String(e&&e.message||e).slice(0,120)));
  }
  assessing=false; save(); renderContinue($("#view-continue"));
}

/* ============================================================================
 * The guided path.
 *
 * Ten sibling views with no entry point is what this replaces. A first-time
 * reader landed inside a working tutoring session for a job that does not
 * exist, with nothing on screen saying so and no way to reach intake.
 *
 * One decision per screen. The stage comes from GET /api/flow, which derives it
 * from the store rather than holding it, so the page cannot disagree with the
 * track about where the candidate is. Every screen says where you are, what
 * this stage is for, the one thing to do, and what happens next.
 *
 * Nothing here is optimistic. A stage advances because the bridge said so in
 * the reply to the action that advanced it, never because the click succeeded.
 * ==========================================================================*/
let flow=null, flowErr="", flowBusy="";
const STAGE_LABEL={
  intake:"Add the job", confirm:"Check what we read", diagnose:"A short conversation",
  approve:"Approve the gaps", research:"Add your sources", curriculum:"Your plan",
  learn:"Learn"
};
const STAGE_BLURB={
  intake:"Paste the link to the job, or the description itself. Either works, and neither is better.",
  diagnose:"A few questions about what the job asks for, and about what your own application claims. What you can already explain is not something you will be taught.",
  approve:"Here is what the conversation found. Nothing is planned or taught until you have been through this list.",
  research:"Paste links to sources you trust. Prepwright fetches them and studies from those. It never goes looking for its own.",
  curriculum:"Your gaps and your sources, ordered so nothing is taught before the thing it depends on.",
  learn:"One step at a time, grounded in the sections pinned to it."
};

async function apiPost(path, body){
  const r=await fetch(API+path,{method:"POST",
    headers:{"content-type":"application/json","x-tutor-bridge":"1"},
    body:JSON.stringify(body||{})});
  let d={}; try{ d=await r.json(); }catch(_){}
  if(!r.ok) throw Object.assign(new Error(d.error||("HTTP "+r.status)),{status:r.status,data:d});
  return d;
}
/* ---- adopting the written curriculum --------------------------------------
 * DATA ships one synthetic track so the page runs before anything real exists.
 * The moment the bridge reports a written plan, that placeholder is replaced in
 * place: meta, stages, topics, practice, checks, questions and story all come
 * from the store. `phases`, `claude` and `codex` are carried over untouched --
 * the first describes the pipeline, the other two are the model registries, and
 * PROVIDER_MODELS captured them at script-eval time, so reassigning either one
 * would leave the model picker pointing at a list nothing reads.
 *
 * Stages group by TIER, not one stage per step. The curriculum already orders
 * steps so nothing is taught before what it depends on, and `ord` keeps that
 * order; what a reader needs on top of it is which steps are the small share
 * that carries most of the interview. Three named blocks say that; twenty
 * single-step stages say nothing.
 *
 * A topic is keyed by its GAP id, not by its position. Marks -- the ticks, the
 * practice statuses -- are stored under that key, and a gap id survives a
 * re-cut of the plan while a step ordinal does not. The step key the bridge
 * minted rides along as `key` and is what a teaching turn is stored under.
 */
const TIER_BLOCKS=[
  {tier:"core",     name:"The core",
   focus:"The small share of this job's material that carries most of the interview. Everything else waits until this is cold."},
  {tier:"depth",    name:"Depth",
   focus:"Where a follow-up question goes once the core answer lands. Enough to stay credible when pushed."},
  {tier:"reference",name:"Reference",
   focus:"Recognise, answer in a sentence, move on. Not worth an hour before the interview."}
];
let adoptedSig="";

/* Every id the page is about to render must exist in `state`, because four
 * render sites dereference state.topics[id].done with no guard and a missing
 * entry is a TypeError that blanks the screen. Additive only: an entry for a
 * topic that has left the plan is left alone. The store is append-only, so
 * deleting here would not remove anything on disk, and a re-cut that brings the
 * topic back would find its tick still there. */
function seedFor(bucket, ids, blank){
  let added=0;
  ids.forEach(id=>{ if(!bucket[id]){ bucket[id]=blank(); added++; } });
  return added;
}

function adoptCurriculum(f){
  const list=(f && Array.isArray(f.stepList)) ? f.stepList : [];
  if(!list.length) return false;
  /* Rebuild only when the plan actually changed. loadFlow runs after every
   * pipeline action as well as at boot, and rebuilding DATA under a view that is
   * already on screen would throw away open disclosure state for no reason. */
  const sig=list.map(s=>[s.key,s.status,s.tier,s.ord,(s.slices||[]).length].join("~")).join("|");
  if(sig===adoptedSig) return false;
  adoptedSig=sig;

  const blocks=TIER_BLOCKS.filter(b=>list.some(s=>s.tier===b.tier));
  const stageOf={};
  DATA.stages=blocks.map((b,i)=>{
    stageOf[b.tier]=i+1;
    const mine=list.filter(s=>s.tier===b.tier);
    const mins=mine.reduce((a,s)=>a+(+s.minutes||0),0);
    return {n:i+1,name:b.name,
      focus:b.focus+" "+mine.length+" step"+(mine.length===1?"":"s")
            +(mins?", about "+mins+" minutes.":".")};
  });

  const topics={};
  list.slice().sort((a,b)=>(a.ord||0)-(b.ord||0)).forEach(s=>{
    const parts=String(s.key||"").split(":");
    const id=String(s.gapId||parts[2]||("S"+s.ord));
    const first=(s.slices&&s.slices[0])||null;
    const label=s.tier?(s.tier.charAt(0).toUpperCase()+s.tier.slice(1)):"Step";
    topics[id]={
      s:stageOf[s.tier]||1, tier:s.tier||"core", key:s.key, ord:s.ord,
      concept:s.title||("Step "+s.ord),
      /* The document a reader would open first, named the way the ledger names
       * it. Never a filename the candidate has no way to resolve. */
      citation:first?(first.docTitle||first.docId||""):"",
      teach:"["+label+" \u00b7 "+(+s.minutes||0)+"m] "+(s.objective||""),
      question:s.objective||"Explain this out loud, without notes.",
      res:(s.slices||[]).map(sl=>({
        t:(sl.docTitle||sl.docId||"a pinned section")
          +(sl.publisher?(" \u00b7 "+sl.publisher):"")
          +(sl.publishedOn?(" \u00b7 "+sl.publishedOn):""),
        u:sl.originUrl||((sl.docId||"")+"\u00a7"+(sl.secId||"")),
        w:(sl.heading||"a pinned section")
          +(sl.vetting?("  \u2014 "+sl.vetting+", trust "+(sl.trust||"?")+"/5"):""),
        m:0}))
    };
  });
  DATA.topics=topics;
  STEP_INDEX={};
  Object.keys(topics).forEach(id=>{
    STEP_INDEX[topics[id].key]={type:"topic",id:id,stage:topics[id].s};
  });

  /* One written thing and one cold check per block. Both are derived from the
   * real step titles rather than invented: a study instruction is not a factual
   * claim, so it does not need a citation, and writing then explaining without
   * notes is the part of preparation a tutor cannot do for you. */
  const practice={}, checks={};
  DATA.stages.forEach(st=>{
    const mine=Object.entries(topics).filter(([,t])=>t.s===st.n);
    if(!mine.length) return;
    const names=mine.slice(0,3).map(([,t])=>t.concept).join("; ");
    const more=mine.length>3?(" and "+(mine.length-3)+" more"):"";
    practice["PR"+st.n]={s:st.n,label:st.name+" \u00b7 one page, in your own words",
      portfolio:st.n===1,
      desc:"Write one page covering "+names+more+". Write it after the teaching, not "
          +"during. If a sentence needs the corpus open in front of you, it is not "
          +"yours yet."};
    checks["CK"+st.n]={s:st.n,label:st.name+" \u00b7 explain all "+mine.length+" cold",
      desc:"Explain each of these with nothing open, including one thing each of them "
          +"does not cover. Falling short is a signal to repeat the step, not to push "
          +"on. \u201cI don't know, but here is how I'd find out\u201d counts; a confident "
          +"wrong answer does not."};
  });
  DATA.practice=practice; DATA.checks=checks;

  const meta=(f && f.track) || {};
  DATA.meta={
    track:meta.title||"This track", role:meta.role_title||"", employer:meta.employer||"",
    sourceKind:meta.source_kind||"", targetDate:"", generatedAt:meta.created_utc||"",
    note:"Cut from the gaps you approved and the sources in this track's corpus. "
        +"The tutor may teach only from the sections pinned to a step, and says so "
        +"when a step's sources do not cover what you asked."};
  /* The placeholder bank and the placeholder resume story described a job that
   * does not exist. Emptied rather than reworded: the bank fills from the recaps
   * you close, and an empty screen that says so is honest where invented rows
   * are not. */
  DATA.questions=[]; DATA.story={claims:[],numbers:[],risks:[]};

  seedFor(state.topics,   Object.keys(topics),   ()=>({done:false}));
  seedFor(state.practice, Object.keys(practice), ()=>({status:"todo",notes:""}));
  state.checks=state.checks||{};
  seedFor(state.checks,   Object.keys(checks),   ()=>({result:"",notes:""}));
  return true;
}

async function loadFlow(quiet){
  try{
    const r=await fetch(API+"/api/flow",{cache:"no-store",
      headers:{"x-tutor-bridge":"1"}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    flow=await r.json(); flowErr="";
  }catch(e){ flow=null; flowErr=String(e.message||e); }
  /* Before any render, so no screen draws the placeholder over a real plan. */
  const adopted=flow?adoptCurriculum(flow):false;
  if(!quiet && $("#view-start").classList.contains("active")) renderStart($("#view-start"));
  else if(adopted){
    /* The plan changed under a view that is already on screen. Redraw whichever
     * one it is, quietly: `silent` because adopting is not a candidate action to
     * save, `keepScroll` because yanking the page to the top mid-read is how a
     * background refresh announces itself as a bug. */
    const act=document.querySelector(".view.active");
    const id=(act&&act.id&&act.id.indexOf("view-")===0)?act.id.slice(5):"";
    if(id) render(id,{silent:true,keepScroll:true});
  }
}

/* The rail. Where you are, what is behind you, what is left. Stages you have
 * passed are not links: going back would mean re-proposing a gap list over one
 * the store already holds, which it refuses, so offering it would be a button
 * that only ever produces an error. */
function stageRail(current){
  const order=["intake","diagnose","approve","research","curriculum","learn"];
  const at=order.indexOf(current);
  return `<ol class="rail-flow" aria-label="Where you are">`+order.map((id,i)=>{
    const st=i<at?"done":(i===at?"now":"next");
    return `<li class="rf ${st}"${i===at?' aria-current="step"':""}>`
      +`<span class="rfdot">${i<at?"&#10003;":String(i+1)}</span>`
      +`<span class="rftxt">${esc(STAGE_LABEL[id]||id)}</span></li>`;
  }).join("")+`</ol>`;
}

function renderStart(el){
  if(flowErr||!flow){
    el.innerHTML=`<div class="vhead"><h1>Prepwright</h1></div>
      <div class="card pad">
        <p class="muted">The bridge is not answering, so this page cannot tell you
        what state your work is in. It is not lost: everything lives in
        <code>~/.prepwright</code>.</p>
        <p class="muted">Open a terminal and run <code>./prep-launcher.sh</code> from the
        Prepwright folder, then reload.</p>
        ${flowErr?`<p class="muted small">${esc(flowErr)}</p>`:""}
        <div class="row"><button class="btn" onclick="loadFlow()">Try again</button></div>
      </div>`;
    return;
  }
  const stage=flow.stage, t=flow.track||{};
  const name=(t.role_title&&t.employer)?`${t.role_title} at ${t.employer}`:(t.title||"");
  el.innerHTML=`<div class="vhead">
      <h1>${stage==="intake"?"Prepwright":esc(name||"Your track")}</h1>
      <p class="sub">${stage==="intake"
        ?"A tutor for one job at a time. It teaches only from sources you chose, and tells you when it has none."
        :esc(showingReceipt(stage)?STAGE_BLURB.research:(STAGE_BLURB[stage]||""))}</p>
    </div>
    ${stage==="intake"?"":stageRail(stage)}
    ${flowBusy?`<div class="card pad busy"><span class="dots"><i></i><i></i><i></i></span> ${esc(flowBusy)}</div>`:""}
    <div id="stageBody">${stageBody(stage)}</div>
    ${trackSwitcher()}`;
  if(trackList===null) loadTracks().then(()=>{
    if(el.classList.contains("active")) renderStart(el);
  });
}

/* ---- which job am I working on --------------------------------------------
 * `current_track_id()` was the whole selection mechanism and it is a file on
 * disk, so the answer to "which job is this" was whichever one was touched last
 * -- which after an import is the newest, not necessarily the one you meant.
 * The API to switch has existed since the store landed; this is the control for
 * it. Hidden when there is only one track, because a picker with one option is
 * furniture. */
let trackList=null;
async function loadTracks(){
  try{
    const r=await fetch(API+"/api/tracks",{cache:"no-store",
      headers:{"x-tutor-bridge":"1"}});
    trackList=r.ok?(await r.json()):{tracks:[],current:null};
  }catch(_){ trackList={tracks:[],current:null}; }
}
function trackSwitcher(){
  const d=trackList||{tracks:[]};
  const rows=d.tracks||[];
  if(rows.length<2) return "";
  return `<div class="card pad switcher">
    <div class="sh"><b>Tracks</b><span>One job at a time. Switching changes the
      plan, the corpus and the progress on screen.</span></div>
    ${rows.map(t=>{
      const on=t.track_id===d.current;
      const label=(t.role_title&&t.employer)?(t.role_title+" at "+t.employer)
                 :(t.title||t.track_id);
      return `<div class="trow ${on?"on":""}">
        <span class="tname">${esc(label)}</span>
        <span class="mono tid">${esc(t.track_id)}</span>
        ${on?`<span class="tnow">open</span>`
            :`<button class="btn btn-sm" data-track="${esc(t.track_id)}">Switch</button>`}
      </div>`;}).join("")}
  </div>`;
}

/* A fetch that succeeds advances the stage on the next reply, so the screen
 * showing which sources landed and which were refused was replaced the instant
 * it had something to say: the reader submitted five links and saw the next
 * question. The receipt is held until they move on themselves. */
function showingReceipt(stage){
  return !!(flow&&flow.research&&(flow.research.results||[]).length&&stage!=="research");
}
function stageBody(stage){
  if(showingReceipt(stage)) return researchCard(stage);
  if(stage==="intake")     return intakeCard();
  if(stage==="diagnose")   return diagnoseCard();
  if(stage==="approve")    return approveCard();
  if(stage==="research")   return researchCard(stage);
  if(stage==="curriculum") return curriculumCard();
  return learnCard();
}

/* The probes, once they have been fetched. Held here rather than in `flow`,
 * because the bridge derives flow from the store on every poll and a plan that
 * has not been proposed yet is not in the store: putting it there would make it
 * vanish under the candidate mid-answer. */
let probePlan=null;

function diagnoseCard(){
  const g=(flow&&flow.gaps)||{};
  if(probePlan && probePlan.probes && probePlan.probes.length) return probeCard();
  return `<div class="card pad stagecard">
    <h2>A short conversation</h2>
    <p class="muted small">Prepwright has read ${esc(String((flow&&flow.posting&&flow.posting.bytes)||0))} bytes

    <p class="muted small">Answering these is what shortens the plan. Anything you

    </div>

    ${g.total?`<p class="muted small">${esc(String(g.total))} already proposed.</p>`:""}
  </div>`;
}

/* One question per thing the posting asks for, plus the claims your own
 * application makes. Leaving one blank is an answer: it grades as `none` and the
 * topic stays on the plan. */
const PROBE_SOURCE_LABEL={posting:"the posting", resume:"your application"};
function probeCard(){
  const probes=probePlan.probes||[];
  const cut=probePlan.cut||{};
  return `<div class="card pad stagecard">
    <h2>${esc(String(probes.length))} questions</h2>
    <p class="muted small">Answer in your own words, a sentence or two. Say what you
    actually did, not what the term means. Leave one blank if you have not touched
    it: a blank is graded as unlearned and stays on the plan, which is the honest
    outcome and not a penalty.</p>
    ${cut.total?`<p class="muted small">${esc(String(cut.total))} more did not fit
      and are treated as unlearned.</p>`:""}
    <div class="probes">${probes.map((p,i)=>`
      <div class="card pad probe">
        <div class="id">${esc(p.probe_id)} · from ${esc(PROBE_SOURCE_LABEL[p.source]||p.source||"")}${
          p.kind?(" · "+esc(p.kind)):""}</div>
        <div class="probe-about">${esc(p.about||"")}</div>
        <p class="muted small">${esc(p.prompt||"")}</p>
        <textarea class="inp probe-answer" data-probe="${esc(p.probe_id)}" rows="2"
          placeholder="What you have actually done here, or leave blank"></textarea>
      </div>`).join("")}</div>
    <div class="row" style="margin-top:14px">
      <button class="btn btn-primary" id="btnGrade">Grade my answers</button>
      <button class="btn" id="btnSkipProbe">Skip the rest and list everything as unlearned</button>
    </div>
    <p class="muted small next">Next: you approve the list before anything is planned.</p>
  </div>`;
}

function approveCard(){
  const gaps=(flow&&flow.gapList)||[];
  const g=(flow&&flow.gaps)||{by_status:{}};
  const left=(g.by_status&&g.by_status.proposed)||0;
  /* The conversation is reachable from here, not only from the stage before it.
   * Answering the questions is the single thing that shortens the plan, and a
   * track that reached this stage with the questions unanswered had no way back
   * to them: the only remedy was to start a second track from the same posting,
   * which is what the last handoff actually recommended. */
  if(probePlan && probePlan.probes && probePlan.probes.length) return probeCard();
  if(!gaps.length){
    return `<div class="card pad stagecard"><h2>Approve the gaps</h2>
      <p class="muted">Loading the list…</p>
      <div class="row"><button class="btn" onclick="loadGaps()">Load it</button></div></div>`;
  }
  return `<div class="card pad stagecard">
    <h2>Approve the gaps</h2>
    <p class="muted small">${esc(String(left))} still to decide, of ${esc(String(gaps.length))}.
      Decline anything you can already explain; it stays on the record either way.</p>
    ${left?`<div class="card pad findbox">
      <div class="sh"><b>Answer a few questions instead</b><span>Faster than
        deciding ${esc(String(left))} of these by hand.</span></div>
      <p class="muted small">One question per thing the posting asks for. What you
      can already explain is dropped rather than taught, so the plan comes out
      shorter and only covers what you actually need before this interview.</p>
      <div class="row"><button class="btn btn-primary" id="btnProbe">Start the conversation</button></div>
    </div>`:""}
    ${(gaps.length && !gaps.some(function(x){return x.status==="approved";}))
      ? `<div class="card pad warnbox"><b>Nothing is approved yet.</b>
         <p class="small">Every gap here is either undecided or declined, so there
         is nothing to find sources for and nothing to plan. Approve at least one,
         or change a decision below, to go on.</p></div>` : ""}
    <ul class="gaplist">${gaps.map(function(x){
      const decided=x.status!=="proposed";
      return `<li class="gap ${esc(x.status)}">
        <div class="gtop"><span class="gtag ${x.jd_span?"jd":"cv"}">${x.jd_span?"the posting asks":"your application claims"}</span>
          <span class="glvl">${esc(x.level)}</span></div>
        <div class="glabel2">${esc(x.label)}</div>
        <div class="gwhy">${esc(x.why||"")}</div>
        <div class="grow">
          ${decided
            ? `<span class="gdone ${esc(x.status)}">${x.status==="approved"?"Will study":"Declined"}</span>
               <button class="btn btn-sm btn-ghost" data-gap="${esc(x.gap_id)}" data-rev="${esc(String(x.rev))}"
                 data-act="${x.status==="approved"?"declined":"approved"}"
                 >${x.status==="approved"?"Actually, I can explain it":"Actually, study this"}</button>`
            : `<button class="btn btn-sm btn-primary" data-gap="${esc(x.gap_id)}" data-rev="${esc(String(x.rev))}" data-act="approved">Study this</button>
               <button class="btn btn-sm" data-gap="${esc(x.gap_id)}" data-rev="${esc(String(x.rev))}" data-act="declined">I can explain it</button>`}
        </div></li>`;}).join("")}</ul>
    <p class="muted small next">Next: the sources you want it to teach from.</p>
  </div>`;
}

function researchCard(stage){
  const r=(flow&&flow.research)||{};
  const results=r.results||[];
  const landed=results.filter(function(x){return x.ok;}).length;
  const moved=!!(stage&&stage!=="research");
  const form=`
    <label class="fl" for="inUrls">One link per line</label>
    <textarea class="in ta" id="inUrls" rows="6" placeholder="https://www.nist.gov/...&#10;https://www.oaic.gov.au/..."></textarea>
    <div class="row">
      <label class="fl inline" for="inVet">How much do you trust these?</label>
      <select class="in sel" id="inVet">
        <option value="primary">Primary — the standard or the law itself</option>
        <option value="secondary" selected>Secondary — a careful write-up</option>
        <option value="vendor">Vendor — a supplier's own documentation</option>
        <option value="community">Community — a blog or a forum</option>
      </select>
    </div>
    <div class="row"><button class="btn ${moved?"":"btn-primary"}" id="btnResearch">${moved?"Fetch these too":"Fetch these"}</button></div>`;
  const list=results.length?`<ul class="reslist">${results.map(function(x){
      return `<li class="${x.ok?"ok":"bad"}"><code>${esc(x.url)}</code>
        <span>${x.ok?("stored as "+esc(x.docId)+", "+esc(String(x.bytes))+" bytes"):esc(x.why||"refused")}</span></li>`;
    }).join("")}</ul>`:"";

  // With a receipt to show, the receipt comes first. Leaving the empty form on
  // top made the reader scroll past a box they had just used to find out what
  // it did.
  if(moved) return `<div class="card pad stagecard">
    <h2>${landed?("Stored "+landed+" source"+(landed===1?"":"s")):"Nothing was stored"}</h2>
    ${list}
    <div class="row"><button class="btn btn-primary" id="btnMoveOn">${landed?"That is enough, build the plan":"Carry on without them"}</button></div>
    <details class="fold"><summary>Add more sources</summary>${form}</details>
  </div>`;

  return `<div class="card pad stagecard">
    <h2>Sources</h2>
    <p class="muted small">Prepwright teaches only from what is here. It records the
    address it finally read, the size and a hash of the bytes, so a citation can be
    checked against its source later.</p>
    <div class="card pad findbox">
      <div class="sh"><b>Let Prepwright look</b><span>One search per gap, against
        standards bodies, regulators and official documentation first.</span></div>
      <p class="muted small">Every address it finds is fetched and read here before
      anything is stored. A page that does not answer, or answers about something
      else, is thrown away with its reason recorded. You can see and undo all of it
      under Sources, and distrusting one stops it reaching any future answer.</p>
      <div class="row"><button class="btn btn-primary" id="btnDiscover">Find sources for my gaps</button></div>
    </div>
    ${fileBox()}
    <div class="fileReport">${filePreview?fileReportHtml(filePreview):""}</div>
    <details class="fold" ${(flow&&flow.corpus&&flow.corpus.documents)?"":"open"}>
      <summary>Or paste links you already trust</summary>${form}</details>
    ${list}
    <p class="muted small next">Next: a plan built from your gaps and these sources.</p>
  </div>`;
}

function curriculumCard(){
  return `<div class="card pad stagecard">
    <h2>Build your plan</h2>
    <p class="muted small">${esc(String((flow&&flow.corpus&&flow.corpus.documents)||0))} document(s) stored,
      ${esc(String((flow&&flow.gaps&&flow.gaps.approved)||0))} gap(s) approved.
      A gap no source covers is set aside and named, not quietly dropped.</p>
    <div class="row"><button class="btn btn-primary" id="btnPlan">Build the plan</button></div>
    <p class="muted small next">Next: the first step.</p>
  </div>`;
}

function hoursish(mins){
  const m=Math.max(0,parseInt(mins,10)||0);
  if(m<60) return m+" minutes";
  const h=Math.floor(m/60), r=m%60;
  return h+"\u00a0h"+(r?" "+r+"\u00a0min":"");
}
function learnCard(){
  const c=(flow&&flow.curriculum)||{tiers:{}};
  const core=(c.tiers&&c.tiers.core)||0;
  return `<div class="card pad stagecard">
    <h2>You are ready</h2>
    <p class="muted">${esc(String(c.steps||0))} step(s), about ${esc(hoursish(c.minutes))} of
      teaching: ${esc(String(core))} core,
      ${esc(String((c.tiers&&c.tiers.depth)||0))} depth,
      ${esc(String((c.tiers&&c.tiers.reference)||0))} reference.</p>
    ${core===(c.steps||0)&&core>8?`<p class="muted small">Every step is core because
      nothing was ruled out. Answering the questions in the conversation is what
      shortens this: what you can already explain does not become a step.</p>`:""}
    <p class="muted">Every step shows what it was allowed to read, and says so when
    the tutor names something that was not there.</p>
    <div class="row">
      <button class="btn btn-primary" onclick="location.hash='#continue'">Start the first step</button>
      <button class="btn" onclick="location.hash='#curriculum'">See the whole plan</button>
    </div>
  </div>`;
}

/* ---- the actions -------------------------------------------------------- */
async function withBusy(msg, fn){
  flowBusy=msg; renderStart($("#view-start"));
  try{ await fn(); }
  catch(e){ flowErr=""; toast(String((e&&e.message)||e)); }
  finally{ flowBusy=""; renderStart($("#view-start")); }
}
function toast(msg){
  const el=$("#stageBody"); if(!el) return;
  const box=document.createElement("div");
  box.className="card pad ground bad"; box.setAttribute("role","alert");
  box.textContent=msg; el.insertBefore(box, el.firstChild);
}
async function loadGaps(){ await loadFlow(); }
document.addEventListener("click", async function(ev){
  const t=ev.target;
  if(!t||!t.closest) return;
  const gapBtn=t.closest("[data-gap]");
  if(gapBtn){
    await withBusy("Recording your decision…", async function(){
      const d=await apiPost("/api/gap",{gapId:gapBtn.getAttribute("data-gap"),
        status:gapBtn.getAttribute("data-act"),
        rev:parseInt(gapBtn.getAttribute("data-rev"),10)});
      flow=d.flow||flow; if(flow) flow.gapList=d.gaps||[];
    });
    return;
  }
  if(t.id==="btnIntake"){
    const url=($("#inUrl")||{}).value||"", text=($("#inText")||{}).value||"";
    const folder=($("#inFolder")||{}).value||"";
    const role=(($("#inRole")||{}).value||"").trim(), emp=(($("#inEmp")||{}).value||"").trim();
    if(!url.trim()&&!text.trim()){ toast("Give me a link or paste the description."); return; }
    if(text.trim()&&!url.trim()&&!(role&&emp)){
      toast("Name the role and the employer. A pasted posting does not carry them, and a track called \u201cUntitled posting\u201d is one you will not recognise next week.");
      return;
    }
    await withBusy("Reading the job…", async function(){
      try{
        const d=await apiPost("/api/intake",{url:url.trim(),text:text,
          roleTitle:role,employer:emp,
          applicationFolder:folder.trim()||undefined});
        flow=d.flow||null;
      }catch(e){
        // 422 is not a failure: the page answered, the body did not. Hand the
        // paste box back with whatever identity was readable rather than an
        // error the reader cannot act on.
        if(e.status===422){
          flow=null; renderStart($("#view-start"));
          const box=$("#inText"); if(box){ box.focus(); }
          toast(e.message); return;
        }
        throw e;
      }
    });
    return;
  }
  if(t.id==="btnProbe"){
    await withBusy("Reading the posting…", async function(){
      probePlan=await apiPost("/api/diagnose",{action:"plan"});
    });
    return;
  }
  if(t.id==="btnGrade"){
    /* Read the boxes now, before the render that follows replaces them. */
    const answers={};
    document.querySelectorAll(".probe-answer").forEach(el=>{
      const id=el.getAttribute("data-probe"), said=(el.value||"").trim();
      if(id&&said) answers[id]=said.slice(0,4000);
    });
    const n=Object.keys(answers).length;
    await withBusy(n?("Grading "+n+" answer(s)…"):"Working through the posting…",
      async function(){
        const d=await apiPost("/api/diagnose",{action:"propose",answers:answers});
        probePlan=null;
        flow=d.flow||flow; if(flow) flow.gapList=d.gaps||[];
        toast("Graded by "+(d.gradedBy||"unknown")+" \u00b7 "+(d.proposed||0)+" to learn");
      });
    return;
  }
  if(t.id==="btnSkipProbe"){
    await withBusy("Working through the posting…", async function(){
      const d=await apiPost("/api/diagnose",{action:"propose"});
      probePlan=null;
      flow=d.flow||flow; if(flow) flow.gapList=d.gaps||[];
    });
    return;
  }
  if(t.id==="btnResearch"){
    const raw=(($("#inUrls")||{}).value||"").split("\n").map(x=>x.trim()).filter(Boolean);
    if(!raw.length){ toast("Paste at least one link."); return; }
    await withBusy("Fetching "+raw.length+" source(s)…", async function(){
      const d=await apiPost("/api/research",{urls:raw,
        vetting:(($("#inVet")||{}).value||"secondary")});
      flow=d.flow||flow; if(flow) flow.research={results:d.results||[]};
      ledger=null;   // the corpus changed; the Sources screen must re-read it
    });
    return;
  }
  if(t.id==="btnMoveOn"){
    if(flow) flow.research=null;
    renderStart($("#view-start"));
    return;
  }
  if(t.id==="btnPlan"){
    await withBusy("Building the plan…", async function(){
      const d=await apiPost("/api/curriculum",{});
      flow=d.flow||flow;
      /* Pinning changes which steps a document serves, and that is a column on
       * the Sources screen. */
      ledger=null;
    });
    return;
  }
  if(t.id==="btnDiscover"){
    await withBusy("Looking for sources and reading each one…", async function(){
      const d=await apiPost("/api/research",
        {action:"discover",provider:activeProvider(),model:activeModel()});
      flow=d.flow||flow;
      const drops=(d.discarded||[]).length;
      toast((d.stored||0)+" source(s) stored"
            +(drops?(" \u00b7 "+drops+" rejected, see Sources"):"")
            +(d.note?(" \u00b7 "+d.note):""));
      ledger=null;
    });
    return;
  }
  /* The panel is mounted twice, in the research stage card and in the Sources
   * view, and `$` is an unscoped document.querySelector. While both are in the
   * DOM the first one wins, and #view-start precedes #view-sources, so every
   * read from the Sources panel returned the hidden stage copy: the user pasted
   * a path, was told to paste a path, and nothing was ingested. Worse, with a
   * stale path in the hidden box it ingested THAT file instead. Nothing in the
   * panel carries an id now, and the action reads the box its button lives in. */
  if(t.hasAttribute&&t.hasAttribute("data-file")){
    const box=t.closest(".filebox"), what=t.getAttribute("data-file");
    if(what==="pick"){ await filePick(box); return; }
    await fileAction(what==="ingest", box);
    return;
  }
  if(t.id==="btnLedgerRetry"){ ledger=null; ledgerErr=""; renderSources($("#view-sources")); return; }
  if(t.hasAttribute&&t.hasAttribute("data-quarantine")){
    const docId=t.getAttribute("data-quarantine"), to=t.getAttribute("data-to");
    await withBusy(to==="ready"?"Restoring…":"Quarantining…", async function(){
      await apiPost("/api/research",{action:"quarantine",docId:docId,status:to});
      ledger=null; await loadLedger();
    });
    renderSources($("#view-sources"));
    return;
  }
  if(t.hasAttribute&&t.hasAttribute("data-track")){
    const id=t.getAttribute("data-track");
    /* Flush first, switch second, RELOAD third. In that order, and the order is
     * the whole fix.
     *
     * The obvious version of this handler switched the bridge and then called
     * reconcileWithDisk(), which merges whatever this page is holding with what
     * it reads from disk. What the page was holding was the OUTGOING track's
     * document. reconcileWithDisk overwrites `trackId` from the GET before the
     * merge, so the bridge's cross-track guard compared B to B and never fired,
     * and the next diff emitted a turn op for every one of track A's
     * transcripts against track B's store. The store is append-only, so there
     * would have been no way to take them out again.
     *
     * A reload is not a shortcut here, it is the correct instrument: a track
     * switch is a rare, deliberate act, and the only way to guarantee that no
     * byte of the old document survives into the new one is to stop having the
     * old document. The flush before it is what stops the outgoing track losing
     * work, and it has to happen while the bridge still points at that track. */
    await withBusy("Switching track…", async function(){
      if(syncState==="pending"||syncState==="saving"||syncState==="error"){
        clearTimeout(syncTimer);
        try{ await pushState({}); }catch(_){ /* reported by the sync pill */ }
      }
      await apiPost("/api/track",{trackId:id});
    });
    location.reload();
    return;
  }
}, false);

async function pingBridge(){
  try{
    const r=await fetch(API+"/api/health",{method:"GET",cache:"no-store"});
    const d=await r.json();
    bridgeProviders=(d&&d.providers&&typeof d.providers==="object")?d.providers:{
      claude:!!(d&&d.claude),codex:!!(d&&d.codex)
    };
    bridgeUp=!!(r.ok&&d&&d.ok);
    /* A restarted bridge mints a new session token, so a page left open from
     * before the restart holds a cookie nothing will accept. /api/health is
     * outside the session gate and answered 200 regardless, so the pill stayed
     * green while every gated route returned 403. It now says which it is. */
    bridgeSession=(d&&typeof d.session==="boolean")?d.session:true;
    bridgeOnline=!!(bridgeUp&&bridgeSession&&providerAvailable(activeProvider()));
    if(bridgeUp&&!bridgeSession&&!staleSessionWarned){
      staleSessionWarned=true;
      toast("This page was open before the Tutor restarted. Reload it to carry on.");
    }
  }catch(e){ bridgeProviders={}; bridgeOnline=false; bridgeUp=false; bridgeSession=true; }
  if($("#view-continue").classList.contains("active")) renderContinue($("#view-continue"));
}

/* ---- best resources per step ------------------------------------------------
 * Deliberately short and deliberately specific: each entry names WHAT to read
 * inside the source and roughly how long it takes. A bare book or paper title
 * is not a resource — it is a thing that never gets opened. Corpus document
 * names render as text; only http(s) links are clickable, so nothing here can
 * be used to smuggle a javascript: URL into the page.                          */
function resBlock(s,m){
  const r=(m&&m.res)||[]; if(!r.length) return "";
  const total=r.reduce((a,x)=>a+(+x.m||0),0);
  return `<div><button class="qtoggle" data-q="res-${esc(s.key)}" data-label="Resources">Best resources${
    total?" · ≈"+total+" min":""} ▾</button>
    <div data-qbody="res-${esc(s.key)}" hidden><div class="reslist">${r.map(x=>`
      <div class="resitem">${(+x.m)?`<span class="rm">${esc(String(x.m))} min</span>`:""}
        <div class="rt">${esc(x.t||"")}</div>
        <div class="rw">${esc(x.w||"")}</div>
        ${x.u?(/^https?:\/\//i.test(x.u)
          ? `<a class="ru" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer">${esc(x.u)}</a>`
          : `<span class="ru">${esc(x.u)}</span>`):""}
      </div>`).join("")}</div></div></div>`;
}

/* ---- what this is costing you ---------------------------------------------
 * Totalled from the usage stamped on every reply. A number you can watch
 * answers "is this burn healthy" continuously instead of once. The model is
 * shown because it is the largest single lever on the total.                  */
function spendTotals(){
  let turns=0,tin=0,tout=0,cost=0,costUnknown=0; const models={};
  Object.values(state.stepLog||{}).forEach(log=>(log||[]).forEach(e=>{
    if(!e.usage) return;
    const known=e.usage.costKnown!==false&&e.usage.cost!=null;
    if(!isAssistantRole(e.role)) return;
    turns++; tin+=e.usage.in||0; tout+=e.usage.out||0;
    if(known)cost+=e.usage.cost||0;else costUnknown++;
    const m=e.resolved||e.model||"?"; models[m]=(models[m]||0)+(e.usage.in||0)+(e.usage.out||0);
  }));
  return {turns,tin,tout,cost,costUnknown,models};
}
function spendPanel(){
  const t=spendTotals();
  if(!t.turns) return "";
  const top=Object.entries(t.models).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="assessbox">
    <div class="sidehead">What you've spent</div>
    <div class="spendrow"><span>${t.turns} repl${t.turns===1?"y":"ies"}</span><b>${t.costUnknown?(t.cost?"$"+t.cost.toFixed(2)+" known + unavailable":"cost unavailable"):"$"+t.cost.toFixed(2)}</b></div>
    ${t.turns?`<div class="spendrow"><span>average per question</span><b>${Math.round(t.tin/t.turns)} in${t.costUnknown?" · provider omits cost":" · $"+(t.cost/t.turns).toFixed(3)}</b></div>`:""}
    <div class="hint recheckhint">Mostly on ${esc(modelLabel(top[0]))}.${
      /fable/i.test(top[0])?" Fable 5 bills about twice Opus 5 per token — worth checking whether the answers are actually better for this material.":""}</div>
  </div>`;
}
/* ---- Re-check: grade the transcripts instead of guessing from turn counts ---
 * Local scores can only count messages. This reads what was actually said —
 * once, on demand, in a single call over every unmarked step that has chat on
 * it. The verdict is advisory: it moves the number, and each row offers the
 * tick, but marking a step delivered stays your call.                        */
function recheckPanel(){
  const rows=(state.assessList||[]);
  const when=state.assessAt?fmt(state.assessAt):"";
  const cost=state.assessCost;
  return `<div class="assessbox">
    <button class="btn btn-sm btn-ghost recheck" id="recheck" ${assessing?"disabled":""}>${
      assessing?"Reading your transcripts…":"Re-check my progress"}</button>
    <div class="hint recheckhint">${
      assessing?"One call over every unmarked step that has chat on it."
      :(when?("Last checked "+esc(when)+(cost?" · "+esc(cost):"")):"Grades how much of each step's own task you delivered. Side questions do not count. One efficient provider call.")}</div>
    ${rows.length?`<div class="sidehead">Delivered against each task</div>${rows.map(r=>{
      const s=stepFromKey(r.key);
      /* A row can outlive the step it grades, because the curriculum can be
       * re-cut between a grade and a render. stepMeta would then dereference a
       * missing DATA entry and take the whole Continue view down with a
       * TypeError, so the guard stays.
       *
       * The old wording here said assessList is persisted. It is not, and
       * pagestate.FIELDS says why beside the table: the list grows with the
       * curriculum and would sit behind a 4 KiB per-mark cap. What survives a
       * reload is state.assess (the clamped map that drives the percentages)
       * plus assessAt and assessCost, which is why the "Last checked" hint
       * outlives the rows it introduces. */
      const known=(s.type==="topic")?DATA.topics[s.id]
                 :(s.type==="practice")?DATA.practice[s.id]:DATA.checks[s.id];
      if(!known) return "";
      const m=stepMeta(s), d=stepDone(s), pc=Math.round((r.mastery||0)*100);
      return `<div class="assessrow">
        <span class="amk ${pc?"":"zero"}">${pc}%</span>
        <span class="atx"><b>${esc(m.title)}</b>${esc(r.reason||"")}</span>
        ${d?`<span class="chip pass">✓</span>`
           :(r.mastery>=0.85?`<button class="btn btn-sm btn-primary" data-deliver="${esc(r.key)}">Mark ✓</button>`:"")}
      </div>`; }).join("")}`:""}
  </div>`;
}

let recapQueue=[], recapIdx=0, recapFlipped=false;

  const bank=state.recapBank||[];
  const weak=bank.filter(q=>state.recap[q.id]&&state.recap[q.id].missed>=2);
  if(!recapQueue.length){ recapQueue=shuffle([...bank]); recapIdx=0; recapFlipped=false; }
  const cur=recapQueue[recapIdx];
  el.innerHTML=`
    <div class="vhead">
      <div class="kicker">Recap drill · shuffled bank</div>
      <h1>Make it survive to the interview.</h1>
      <p class="sub">The recap bank. Flip to reveal, then mark whether you got it. The deck reshuffles every lap, so each card comes round again whether or not you got it last time. A card missed twice or more is listed below as a standing weak spot; the count records what happened and does not clear.</p>
    </div>
    ${bank.length?`
    <div class="flash">
      <div class="flashcard">
        <div class="qtext">${esc(cur.q)}</div>
        ${recapFlipped?`<div class="atext">${esc(cur.a)}</div>`:""}
        <div class="tag">${esc(cur.stage||"")} · card ${recapIdx+1} / ${recapQueue.length}</div>
      </div>
      <div class="flash-actions">
        ${!recapFlipped?`<button class="btn btn-primary" id="rcFlip">Reveal answer</button>`:`
          <button class="btn" id="rcMiss" style="border-color:var(--alert);color:var(--alert)">Missed it</button>
          <button class="btn btn-primary" id="rcGot">Got it</button>`}
        <button class="btn btn-ghost" id="rcSkip">Skip</button>
      </div>
    </div>
    ${weak.length?`<div class="weaklist">
      <div class="sect-title"><span class="kick">Weak list · missed twice or more</span><span class="rule"></span></div>
      ${weak.map(q=>`<div class="weakitem"><span>${esc(q.q)}</span><span class="mono">×${state.recap[q.id].missed}</span></div>`).join("")}
    </div>`:""}
    `:emptyState("The recap bank is empty","Close a session on a step and its recap questions land here.")}
  `;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* The interview question bank. Self-graded, keyed by index, and the citation
 * behind each answer stays hidden until you have committed to one. */
function renderQuestions(el){
  const bank=DATA.questions||[];
  const graded=Object.values(state.questions);
  const correct=graded.filter(g=>g==="correct").length;
  const partial=graded.filter(g=>g==="partial").length;
  const score=correct+partial*0.5;
  const total=bank.length||1;
  const bar=Math.round(score/total*100);
  el.innerHTML=`
    <div class="vhead">
      <div class="kicker">Interview questions</div>
      <h1>The questions you should be able to answer cold.</h1>
      <p class="sub">Answer out loud with nothing open, self-grade, then reveal the corpus document the answer comes from. "I don't know, but here is how I'd find out" is full credit. A confident wrong answer is not.</p>
      <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-top:18px">
        <div class="card stat"><div class="lab">Self-graded score</div><div class="val tnum">${score}<small> / ${bank.length}</small></div><div class="bar"><i style="width:${bar}%"></i></div></div>
        <div class="card stat win"><div class="lab">Correct</div><div class="val tnum">${correct}</div></div>
        <div class="card stat check"><div class="lab">Partial</div><div class="val tnum">${partial}</div></div>
      </div>
    </div>
    ${bank.length?bank.map((q,i)=>{
      const g=state.questions[i]||"";
      return `<div class="card qcard">
        <div class="qhead"><span class="num">Q${i+1}</span><span class="qtext">${esc(q.q)}</span></div>
        <div class="grades" data-question="${i}">
          ${[["correct","Correct"],["partial","Partial"],["miss","Missed"]].map(([v,l])=>`<button class="gbtn ${g===v?"on":""}" data-g="${v}">${l}</button>`).join("")}
          <button class="gbtn" data-reveal="${i}" style="margin-left:auto">Reveal answer ▾</button>
        </div>
        <div class="src" data-src="${i}"><span class="lab">The answer:</span> ${esc(q.a)}<br><span class="lab">Where it comes from:</span> <span class="mono">${esc(q.where||"—")}</span></div>
      </div>`;
    }).join(""):emptyState("The question bank is empty","A generated track fills this from the corpus.")}`;
}

/* ---- back to top ----------------------------------------------------------
 * rAF-throttled and passive: this fires on every scroll frame and must not
 * compete with rendering a chat. The threshold is roughly where the heading
 * leaves the screen, which is exactly when the pinned bar starts earning its
 * place, so the two appear together.                                          */
const REDUCED_MOTION=window.matchMedia("(prefers-reduced-motion:reduce)");
let topTick=false;
function paintToTop(){
  topTick=false;
  const b=document.getElementById("toTop");
  if(b) b.classList.toggle("show",window.scrollY>300);
}
window.addEventListener("scroll",()=>{
  if(!topTick){ topTick=true; requestAnimationFrame(paintToTop); }
},{passive:true});
function scrollToTop(){
  window.scrollTo({top:0,behavior:REDUCED_MOTION.matches?"auto":"smooth"});
  paintToTop();
}

/* =====================================================================
 *  EVENTS (delegation)
 * ===================================================================== */
document.addEventListener("click",e=>{
  const t=e.target;

  if(t.closest("#toTop")){ scrollToTop(); return; }

  // nav
  const nav=t.closest(".navlink"); if(nav){ location.hash="#"+nav.dataset.view; closeRail(); return; }

  // continue: send a response into the step log
  if(t.id==="stepSend"){ const key=t.dataset.stepkey, ta=$("#stepMsg"), txt=((ta&&ta.value)||"").trim();
    if(!txt){ toast("Write something first"); ta&&ta.focus(); return; }
    state.stepLog=state.stepLog||{};
    (state.stepLog[key]=state.stepLog[key]||[]).push({ts:Date.now(),role:"me",text:txt});
    if(ta) ta.value="";           // sent, so it must not come back as a draft
    focusStepKey=key; save(); renderContinue($("#view-continue")); askTutor(key); return; }
  // continue: re-grade every in-progress step from its transcript
  if(t.closest("#recheck")){ recheckProgress(); return; }
  // continue: mark a step delivered
  const dv=t.closest("[data-deliver]");
  if(dv){ const s=stepFromKey(dv.dataset.deliver); setStepDone(s,true); focusStepKey=null;
    if(stageComplete(s.stage)) contStage=s.stage; toast("Delivered ✓"); renderContinue($("#view-continue")); refreshBadges(); return; }
  // continue: undo a delivered step
  const cs=t.closest("[data-closesess]");
  if(cs){ closeSession(cs.dataset.closesess); return; }
  const undo=t.closest("[data-undo]");
  if(undo){ setStepDone(stepFromKey(undo.dataset.undo),false); focusStepKey=undo.dataset.undo; renderContinue($("#view-continue")); refreshBadges(); return; }
  // continue: focus a step from the side list
  const jp=t.closest("[data-jump]");
  if(jp){ const [sn,key]=String(jp.dataset.jump).split("|");
    contStage=+sn; focusStepKey=key; renderContinue($("#view-continue")); return; }
  const fs=t.closest("[data-focus]");
  if(fs){ focusStepKey=fs.dataset.focus; renderContinue($("#view-continue")); return; }
  // continue: change stage / start next stage
  const cst=t.closest("[data-cstage]");
  if(cst){ contStage=+cst.dataset.cstage; focusStepKey=null; renderContinue($("#view-continue")); return; }
  const sst=t.closest("[data-startstage]");
  if(sst){ contStage=+sst.dataset.startstage; focusStepKey=null; renderContinue($("#view-continue")); return; }

  // stage expand
  const stagebtn=t.closest(".stagebtn");
  if(stagebtn){
    const n=stagebtn.dataset.stage;
    const box=$(`.stagedetail[data-detail="${n}"]`);
    const open=stagebtn.getAttribute("aria-expanded")==="true";
    $$(".stagedetail").forEach(d=>{ if(d!==box) d.innerHTML=""; });
    $$(".stagebtn").forEach(b=>{ if(b!==stagebtn) b.setAttribute("aria-expanded","false"); });
    if(open){ box.innerHTML=""; stagebtn.setAttribute("aria-expanded","false"); }
    else{ box.innerHTML=stageDetailHTML(+n); stagebtn.setAttribute("aria-expanded","true"); }
    return;
  }

  // socratic reveal
  const qt=t.closest(".qtoggle");
  if(qt){ const id=qt.dataset.q; const body=$(`[data-qbody="${id}"]`); if(body){ body.hidden=!body.hidden; const lab=qt.dataset.label||"Question"; qt.textContent=lab+" "+(body.hidden?"▾":"▴"); } return; }

  // tier tab
  const tab=t.closest(".tab");
  if(tab){ const el=$("#view-curriculum"); el.dataset.tier=tab.dataset.tier; renderCurriculum(el); return; }

  // practice status seg
  const segBtn=t.closest(".seg [data-v]");
  if(segBtn){
    const seg=segBtn.closest(".seg");
    if(seg.dataset.practice){
      state.practice[seg.dataset.practice].status=segBtn.dataset.v; save();
      seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===segBtn));
      // refresh stage/overview badges if affecting
      refreshBadges();
      return;
    }
    if(seg.dataset.check){
      const cid=seg.dataset.check;
      state.checks[cid]=state.checks[cid]||{}; state.checks[cid].result=segBtn.dataset.v||""; save();
      seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===segBtn));
      refreshBadges(); return;
    }
  }

  // question-bank grade
  const gbtn=t.closest(".grades [data-g]");
  if(gbtn){ const wrap=gbtn.closest(".grades"); state.questions[wrap.dataset.question]=gbtn.dataset.g; save();
    wrap.querySelectorAll("[data-g]").forEach(b=>b.classList.toggle("on",b===gbtn));
    // update header score without full re-render jump
    renderQuestions($("#view-questions")); return; }
  const rev=t.closest("[data-reveal]");
  if(rev){ const box=$(`[data-src="${rev.dataset.reveal}"]`); box.classList.toggle("show"); rev.textContent=box.classList.contains("show")?"Hide answer ▴":"Reveal answer ▾"; return; }

  // qa
  if(t.id==="qaAdd"){ addQA(); return; }

  // recap
  if(t.id==="rcFlip"){ recapFlipped=true; renderRecap($("#view-recap")); return; }
  if(t.id==="rcGot"||t.id==="rcMiss"){ markRecap(t.id==="rcGot"); return; }
  if(t.id==="rcSkip"){ advanceRecap(); return; }

  // sessions
  if(t.id==="addSession"){ openSessionModal(); return; }

  // theme + rail
  if(t.closest("#themeBtn")||t.closest("#themeBtnM")){ toggleTheme(); return; }
  if(t.closest("#menuBtn")){ openRail(); return; }
  if(t.closest("#railToggle")){ toggleRail(); return; }
  if(t.closest("#sideToggle")){ toggleSide(); return; }
  if(t.id==="backdrop"){ closeRail(); return; }

  // export/import
  if(t.closest("#exportBtn")){ exportData(); return; }
  if(t.closest("#importBtn")){ $("#importFile").click(); return; }

  // modal
  if(t.id==="modalBg"){ closeModal(); return; }
  if(t.closest("[data-close]")){ closeModal(); return; }
  if(t.id==="saveSession"){ saveSessionFromModal(); return; }
});

// checkbox change (topics)

  const cb=e.target.closest("[data-topic]");
  if(cb){ state.topics[cb.dataset.topic].done=cb.checked; save(); refreshBadges();
    // update curriculum tab counts if on that view

    state.provider=currentProvider(pvd.value);
    state.model=currentModel(state.models[state.provider],state.provider);
    bridgeOnline=providerAvailable(state.provider);
    save(); toast("Tutor provider: "+providerLabel(state.provider));
    renderContinue($("#view-continue")); pingBridge(); return;
  }
  const mdl=e.target.closest("#tutorModel");
  // Re-render on a model change: the effort control shows the level remembered for
  // whichever model is selected, so leaving it stale would show the wrong one.
  if(mdl){ const p=activeProvider(); state.model=currentModel(mdl.value,p);
    state.models=state.models||Object.assign({},DEFAULT_MODELS); state.models[p]=state.model; save();
    toast("Tutor model: "+modelLabel(state.model)+" · thinking "+effortLabel(effortFor(state.model)));
    renderContinue($("#view-continue")); return; }
  const eff=e.target.closest("#tutorEffort");
  if(eff){ const m=activeModel(); setEffortFor(m,eff.value);

      +(eff.value?"":" (no --effort flag sent)")); return; }
});

function addQA(){

/* ---- recap ---- */
function markRecap(got){
  const cur=recapQueue[recapIdx]; if(!cur) return;
  state.recap[cur.id]=state.recap[cur.id]||{got:0,missed:0};
  if(got) state.recap[cur.id].got++; else state.recap[cur.id].missed++;
  save(); advanceRecap();
}
function advanceRecap(){
  recapFlipped=false; recapIdx++;

}

function saveSessionFromModal(){
  const date=$("#sDate").value||new Date().toISOString().slice(0,10);
  const title=$("#sTitle").value.trim()||"Session";
  const recap=[];
  ["sRQ1","sRQ2","sRQ3"].forEach(id=>{
    const v=$("#"+id).value.trim(); if(v&&v.includes("|")){ const [q,a]=v.split("|"); recap.push({q:q.trim(),a:a.trim()}); }
    else if(v){ recap.push({q:v,a:""}); }
  });
  const s={id:makeId(),date,title,
    covered:$("#sCov").value.trim(),explainBack:$("#sEB").value.trim(),
    practice:$("#sPr").value.trim(),redFlags:$("#sRF").value.trim(),recap};
  state.sessions.push(s);
  // add recap to bank
  recap.forEach((r,i)=>{ const id="u"+s.id+"q"+i; state.recapBank.push({id,q:r.q,a:r.a,stage:title}); state.recap[id]={got:0,missed:0}; });
  recapQueue=[]; save(); closeModal(); renderSessions($("#view-sessions")); toast("Session logged");
}

/* ---- export / import ---- */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="prepwright-progress-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast("Progress exported");
}
const MAX_IMPORT_BYTES=16*1024*1024;
function safeImportTree(v,depth=0){
  if(depth>12) return false;
  if(v===null||typeof v==="boolean"||typeof v==="number") return true;
  if(typeof v==="string") return v.length<=200000;
  if(Array.isArray(v)) return v.length<=10000&&v.every(x=>safeImportTree(x,depth+1));
  if(typeof v!=="object") return false;
  const keys=Object.keys(v);
  if(keys.length>10000||keys.some(k=>k==="__proto__"||k==="prototype"||k==="constructor")) return false;
  return keys.every(k=>safeImportTree(v[k],depth+1));
}
function importData(file){
  if(!file||file.size>MAX_IMPORT_BYTES){ toast("Import failed — file is too large"); return; }
  const r=new FileReader();
  r.onload=()=>{
    try{ const s=JSON.parse(r.result);
      if(!s||Array.isArray(s)||typeof s!=="object"||!safeImportTree(s)) throw new Error("unsafe shape");
      if(s.stepLog&&typeof s.stepLog!=="object") throw new Error("bad step log");
      state=hydrate(mergeStates(state,s));
      /* This MERGES; it no longer replaces. The store is append-only by
       * design, so a document cannot subtract from it and there is no honest
       * way to make this button mean "throw away what is saved". What the
       * `replace` intent still buys is the refusal: a bulk write from a view
       * that is behind the store is rejected outright rather than quietly
       * folded in, which is the one case where a merge would surprise. A true
       * replace belongs to the track switcher, as a new track built from the
       * file, and that is not built yet. */
      savePrefs();
      pushState({intent:"replace",reconciling:!reconciled});
      if(state.theme)document.documentElement.setAttribute("data-theme",state.theme);
      recapQueue=[]; render(state.lastView||"overview");
      toast("Progress merged in from the file");
    }catch(e){ toast("Import failed — invalid file"); }
  };
  r.readAsText(file);
}

/* ---- the source ledger -----------------------------------------------------
 * Every document this track can teach from, where it came from, who published
 * it, when the page says it was written, how it was ranked and which steps it
 * serves. Plus the discovery runs, including what they threw away.
 *
 * This screen is the reason the app is allowed to go looking for sources on its
 * own. Nothing enters the corpus without being fetched and checked, and this is
 * where that work is auditable after the fact: distrust one and its sections
 * stop reaching any future pack, while the row and its provenance stay put.
 */
let ledger=null, ledgerErr="";
const VET_ORDER={primary:0,vendor:1,secondary:2,community:3};

async function loadLedger(){
  try{
    const r=await fetch(API+"/api/ledger",{cache:"no-store",
      headers:{"x-tutor-bridge":"1"}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    ledger=await r.json(); ledgerErr="";
  }catch(e){ ledger=null; ledgerErr=String(e.message||e); }
}

function reportOf(run){
  /* One parse, two readers. The run's report shape differs by `kind`: a
   * discovery discard is {gap_id, url, stage, why} and a file-ingest discard is
   * {heading, why}. One template read `stage` and `url` for both, so a file
   * run's rows rendered with a blank stage, a blank URL and a reason like
   * "scored 17% of the best match" attached to nothing the reader could
   * identify. */
  try{ return JSON.parse(run.queries||"{}")||{}; }
  catch(_){ return {}; }
}
function isFileRun(run){ return reportOf(run).kind==="file"; }

function discardsOf(run){
  /* The run stores its report as JSON in one column, because the alternative is
   * a table for something only this screen reads. A run written by an older
   * build, or one that failed before it could write a report, parses to nothing
   * and says so rather than throwing. */
  const q=reportOf(run);
  return Array.isArray(q.discarded)?q.discarded:[];
}

/* ---- studying from a resource the candidate already has --------------------
 *
 * The file never crosses the HTTP boundary. The page sends a path and the
 * bridge opens it, which is the right shape for an app that runs on the same
 * machine as the file: no upload cap to raise, no request boundary to widen,
 * and `ingest.resolve` already refuses anything inside Prepwright's own store.
 *
 * Two buttons, not one. Reading and cutting a resource costs no tokens, so the
 * candidate can see exactly what would be stored, and what would be left out,
 * before any of a track's 48-document budget is spent on it.
 */
let filePreview=null, fileGoal="", fileDepth="focused";

function fileBox(){
  const f=filePreview||{};
  return `<div class="card pad findbox filebox">
    <div class="sh"><b>Study from a file you already have</b><span>PDF, Word,
      Excel, CSV, Markdown, HTML or plain text.</span></div>
    <p class="muted small">Say what you want to learn from it and Prepwright keeps
    the part that answers that, in the resource's own words, with the rest listed
    and left out. Reading the file costs nothing: no part of it is sent anywhere,
    and only the sections a step actually teaches from ever reach a model.</p>
    <label class="fl">Path to the file
      <input class="fl-path" type="text" spellcheck="false" placeholder="/Users/you/Documents/handbook.pdf"
             value="${esc(f.path||"")}"></label>
    <div class="row">
      <button class="btn btn-sm btn-ghost" data-file="pick">Choose a file\u2026</button>
      <span class="muted tiny">or, in Finder, select the file and press
      <b>\u2325\u2318C</b> to copy its path and paste it above.</span>
    </div>
    <label class="fl">What do you want to learn from it
      <input class="fl-goal" type="text" spellcheck="false"
             placeholder="agent orchestration, tool calling, memory across turns"
             value="${esc(fileGoal)}"></label>
    <label class="fl">How much of it to keep
      <select class="fl-depth">
        <option value="focused"${fileDepth==="focused"?" selected":""}>Focused \u2014 only what is squarely on the goal</option>
        <option value="balanced"${fileDepth==="balanced"?" selected":""}>Balanced</option>
        <option value="broad"${fileDepth==="broad"?" selected":""}>Broad \u2014 anything that touches it</option>
      </select></label>
    <div class="row">
      <button class="btn btn-ghost" data-file="preview">Check it first</button>
      <button class="btn btn-primary" data-file="ingest">Add it to this track</button>
    </div>
  </div>`;
}

function fileReportHtml(r){
  if(!r) return "";
  if(!r.ok) return `<div class="card pad warnbox"><b>Not stored.</b>
    <p class="small">${esc(r.reason||"That file could not be read.")}</p></div>`;
  const cov=r.coverage||{};
  const drops=(r.dropped||[]).slice(0,12);
  return `<div class="card pad srcreport">
    <div class="sh"><b>${esc(r.title||r.name||"Resource")}</b>
      <span>read with ${esc(r.how||"?")}${r.committed?" \u00b7 stored":" \u00b7 preview only"}</span></div>
    <div class="statrow">
      <span><b>${esc(String(r.sections||0))}</b> sections in the file</span>
      <span><b>${esc(String(r.kept||0))}</b> match your goal</span>
      <span><b>${esc(String(r.documents||0))}</b> document(s)</span>
      <span>${cov.goal_terms?("<b>"+Math.round((cov.ratio||0)*100)+"%</b> of your goal is covered"):"whole resource"}</span>
    </div>
    ${r.warning?`<p class="warn small">${esc(r.warning)}</p>`:""}
    ${(r.failed||[]).length?`<div class="warnbox pad"><b>Only part of it was stored.</b>
      <p class="small">${esc(String((r.failed||[]).length))} document(s) were refused
      by the store, and everything after the first refusal was not attempted.</p>
      <ul class="tight">${(r.failed||[]).map(f=>`<li>${esc(f.title||"")} \u2014
        <span class="muted">${esc(f.why||"")}</span></li>`).join("")}</ul></div>`:""}
    ${r.overflow?`<p class="warn small">${esc(String(r.overflow))} section(s) matched
      your goal but did not fit the share of this track one resource may take.
      Narrow the goal, or raise the depth to Focused, to choose which parts to keep.</p>`:""}
    ${(r.headings||[]).length?`<details class="fold" open><summary>What it will teach from</summary>
      <ul class="tight">${(r.headings||[]).slice(0,20).map(h=>`<li>${esc(h)}</li>`).join("")}</ul></details>`:""}
    ${drops.length?`<details class="fold"><summary>Left out (${esc(String(r.dropped_total||drops.length))})</summary>
      <ul class="tight">${drops.map(d=>`<li>${esc(d.heading||"")} \u2014 <span class="muted">${esc(d.why||"")}</span></li>`).join("")}</ul></details>`:""}
  </div>`;
}

async function filePick(box){
  /* The dialog is opened by the BRIDGE, not by the page. A browser file input
   * hands JavaScript the basename and never the path, in every browser and by
   * design, so a picker on the page could not fill the box this panel reads.
   * Uploading the bytes instead would put a large body on a route that writes
   * to disk. The bridge is a local process on this machine, so it asks the
   * operating system and returns a path, which then goes through the same
   * resolve() and gate() a typed path does. */
  if(!box) return;
  let picked="";
  await withBusy("Waiting for you to choose a file\u2026", async function(){
    let d;
    try{ d=await apiPost("/api/research",{action:"pick_file"}); }
    catch(err){ toast((err&&err.message)||String(err)); return; }
    if(d&&d.ok&&d.path){
      picked=d.path;
      filePreview=Object.assign({}, filePreview||{}, {path:d.path});
    }else if(d&&d.reason){ toast(d.reason); }
  });
  /* withBusy repaints, so the input this started from is gone. Fill whichever
   * copies of the panel are on screen now. */
  if(picked){
    Array.prototype.forEach.call(document.querySelectorAll(".filebox .fl-path"),
      function(el){ el.value=picked; });
  }
}

async function fileAction(commit, box){
  if(!box) return;
  const pick=sel=>box.querySelector(sel);
  const path=((pick(".fl-path")||{}).value||"").trim();
  if(!path){ toast("Paste the path to the file first"); return; }
  fileGoal=((pick(".fl-goal")||{}).value||"").trim();
  fileDepth=((pick(".fl-depth")||{}).value||"focused");
  await withBusy(commit?"Reading the file and storing what matches\u2026"
                      :"Reading the file\u2026", async function(){
    let d;
    try{
      d=await apiPost("/api/research",{action:commit?"ingest_file":"preview_file",
        path:path, goal:fileGoal, depth:fileDepth});
    }catch(err){
      filePreview={ok:false, reason:(err&&err.message)||String(err), path:path};
      return;
    }
    filePreview=Object.assign({}, d.report||{}, {committed:!!d.committed, path:path});
    if(commit){
      flow=d.flow||flow;
      ledger=null;
      toast((filePreview.documents||0)+" document(s) stored from "
            +(filePreview.name||"the file"));
    }
  });
  renderSources($("#view-sources"));
}

function renderSources(el){
  if(!ledger&&!ledgerErr){
    el.innerHTML=`<div class="vhead"><h1>Sources</h1></div>
      <div class="card pad"><p class="muted">Reading the ledger…</p></div>`;
    loadLedger().then(()=>{ if(el.classList.contains("active")) renderSources(el); });
    return;
  }
  if(ledgerErr){
    el.innerHTML=`<div class="vhead"><h1>Sources</h1></div>
      <div class="card pad"><p class="muted">The bridge did not answer: ${esc(ledgerErr)}</p>
      <div class="row"><button class="btn" id="btnLedgerRetry">Try again</button></div></div>`;
    return;
  }
  const docs=(ledger.documents||[]).slice().sort((a,b)=>
    (VET_ORDER[a.vetting]-VET_ORDER[b.vetting])||(b.trust-a.trust)||
    String(a.doc_id).localeCompare(String(b.doc_id)));
  const runs=ledger.runs||[];
  const live=docs.filter(d=>d.status==="ready").length;
  /* Counted apart, because they are different things. A nomination is a page
   * the app found and threw away; a file drop is a section of the candidate's
   * own document that did not match their goal. Summing them and calling the
   * total "nominations rejected" told the candidate the app had rejected
   * hundreds of web sources it never saw. */
  const drops=runs.filter(r=>!isFileRun(r)).reduce((a,r)=>a+discardsOf(r).length,0);
  const cuts=runs.filter(isFileRun).reduce((a,r)=>a+discardsOf(r).length,0);

  el.innerHTML=`<div class="vhead"><h1>Sources</h1>
      <p class="sub">${esc(String(live))} in use of ${esc(String(docs.length))} held${
        drops?(" · "+esc(String(drops))+" nominations rejected"):""}${
        cuts?(" · "+esc(String(cuts))+" section(s) left out of supplied files"):""}.
      The tutor may quote only these.</p></div>
    ${fileBox()}
    <div class="fileReport">${filePreview?fileReportHtml(filePreview):""}</div>
    ${docs.length?`<div class="srclist">${docs.map(d=>{
      const serves=d.serves||[];
      const quarantined=d.status!=="ready";
      return `<div class="card pad src ${quarantined?"quarantined":""}">
        <div class="srctop">
          <span class="vet vet-${esc(d.vetting)}">${esc(d.vetting)}</span>
          <span class="trust">trust ${esc(String(d.trust))}/5</span>
          <span class="mono srcid">${esc(d.doc_id)}</span>
          ${quarantined?`<span class="vet vet-quar">${esc(d.status)}</span>`:""}
        </div>
        <h3>${esc(d.title||"(untitled)")}</h3>
        <div class="srcmeta">
          <span>${esc(d.publisher||"publisher not recorded")}</span>
          <span>${d.published_on?("dated "+esc(d.published_on)):"no date on the page"}</span>
          <span>${esc(String(d.n_sections))} section${d.n_sections===1?"":"s"}</span>
          <span>fetched ${esc((d.fetched_utc||"").slice(0,10))}</span>
        </div>
        ${/^https?:\/\//i.test(d.origin_url||"")
          ? `<a class="ru" href="${esc(d.origin_url)}" target="_blank" rel="noopener noreferrer">${esc(d.origin_url)}</a>`
          : `<span class="ru">${esc(d.origin_url||"")}</span>`}
        <div class="srcserves">${serves.length
          ? "Teaches: "+serves.map(s=>esc(s.gapId||s.stepKey)).join(", ")
          : "Not pinned to any step yet."}</div>
        <div class="row">
          <button class="btn btn-sm" data-quarantine="${esc(d.doc_id)}"
            data-to="${quarantined?"ready":"quarantined"}">${
            quarantined?"Trust it again":"Distrust this source"}</button>
        </div>
      </div>`;}).join("")}</div>`
      : `<div class="card pad"><p class="muted">Nothing has been fetched into this
         track yet.</p></div>`}
    ${runs.length?`<div class="vhead" style="margin-top:26px"><h2>Discovery runs</h2>
      <p class="sub">What was looked for, and what was turned away.</p></div>
      ${runs.map(r=>{const dd=discardsOf(r);
        return `<div class="card pad run">
        <div class="srctop"><span class="mono srcid">${esc(r.run_id)}</span>
          <span class="trust">${esc(r.status)}</span>
          <span class="trust">${esc((r.started_utc||"").replace("T"," ").slice(0,16))}</span>
          <span class="trust">${esc(String(r.tool_calls))} model call${r.tool_calls===1?"":"s"}</span></div>
        ${dd.length?`<div class="drops">${dd.map(x=>`
          <div class="drop">${x.heading!==undefined
            ? `<span class="dstage">section</span>
               <span class="durl">${esc(String(x.heading||"(untitled)").slice(0,110))}</span>`
            : `<span class="dstage">${esc(x.stage||"")}</span>
               <span class="durl">${esc((x.url||"").slice(0,110))}</span>`}
            <div class="dwhy">${esc(x.why||"")}</div></div>`).join("")}</div>`
          : `<p class="muted small">Nothing was ${isFileRun(r)?"left out of":"rejected on"} this run.</p>`}
      </div>`;}).join("")}`:""}`;
}

/* ---- toast ---- */
let toastT;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2200); }

/* =====================================================================
 *  INIT
 * ===================================================================== */
function buildNav(){
  $("#nav").innerHTML=NAV.map(n=>`<button class="navlink" data-view="${n.id}">
    ${ICON[n.id]}<span>${esc(n.label)}</span></button>`).join("");
}
/* The view that is on screen right now.
 *
 * The four redraw-after-adopt sites used `state.lastView`, which is a persisted
 * preference, and adopting a document from the bridge replaces it with whatever
 * that document carries. A first run therefore rendered the guided path, then
 * adopted a state whose lastView was the seed default, and jumped straight back
 * into the tutoring session the guided path exists to stand in front of. The
 * DOM knows which view is active; the preference only knows which one was.
 */
function currentView(){
  const on=document.querySelector(".view.active");
  if(on) return on.id.replace(/^view-/,"");
  const v=(location.hash||"").slice(1);
  return (v==="start"||NAV.some(n=>n.id===v))?v:"start";
}
function routeFromHash(){
  const v=(location.hash||"#start").slice(1);
  // `start` is routable without being in NAV. It is the guided path, and it
  // belongs in the sidebar only once there is something to leave it for.
  render((v==="start"||NAV.some(n=>n.id===v))?v:"start");
}
window.addEventListener("hashchange",routeFromHash);

(function init(){
  // theme: stored → else prefers-color-scheme
  if(state.theme) document.documentElement.setAttribute("data-theme",state.theme);
  else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme:light)").matches)
    document.documentElement.setAttribute("data-theme","light");
  buildNav();
  applyRail();               // restore the sidebar's collapsed/expanded state
  // Where to land is decided by the track, not by a constant. A first-time
  // reader was dropped straight into a live tutoring session for a fabricated
  // job, with no intake, no explanation and no screen saying "you have no track
  // yet". #start renders whichever stage the track is actually in, and steps
  // aside the moment there is real work to resume.
  if(!location.hash) location.hash="#start";
  routeFromHash();
  pingBridge();              // detect the live tutor bridge, update the status pill
  loadFlow();                // ask the bridge which stage this track is in
  reconcileWithDisk();       // adopt the disk copy if it is newer, else push ours up
})();
</script>
