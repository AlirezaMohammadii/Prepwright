<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Prepwright" />
<title>Prepwright — interview preparation</title>
<meta name="description" content="Local interview-preparation tutor: diagnose the gaps for one job, research them into a corpus, and teach the small share of it that carries most of the value." />
<style>
/* ============================================================= *
 *  Prepwright — prep-desk design system
 *  Single self-contained file. Talks only to the local bridge (same origin):
 *  chat via /api/chat and private progress via /api/state. localStorage keeps
 *  harmless UI preferences, plus a temporary copy of unsaved work, chat text
 *  included, for as long as the bridge is unreachable. See PENDING_KEY.
 * ============================================================= */

:root{
  /* --- prep-desk palette (dark default) --- */
  --ink:#0B1120;            /* base */
  --surface:#111a2e;        /* panels */
  --surface-2:#16213b;      /* elevated */
  --surface-3:#1d2b48;      /* hover */
  --line:#243350;           /* borders */
  --line-soft:#1a2740;
  --text:#E9EFF8;           /* primary text */
  --text-muted:#9DB0CC;     /* secondary */
  --text-faint:#67789a;     /* tertiary */

  --signal:#3BC9D6;         /* primary accent */
  --signal-dim:#2a8f99;
  --signal-glow:rgba(59,201,214,.16);
  --win:#F5B44C;            /* delivered practice / wins */
  --win-glow:rgba(245,180,76,.14);
  --gate:#A78BFA;           /* stage checks */
  --gate-glow:rgba(167,139,250,.16);
  --pass:#4ADE80;           /* pass verdicts */
  --alert:#F87171;          /* outstanding / missed */

  --radius:14px;
  --radius-sm:9px;
  --radius-lg:20px;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 30px rgba(0,0,0,.28);
  --shadow-soft:0 1px 0 rgba(255,255,255,.02),0 6px 18px rgba(0,0,0,.22);

  --ff-sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ff-serif:ui-serif,Georgia,"Times New Roman",serif;
  --ff-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;

  --rail:250px;
  --maxw:1120px;
  --dur:.22s;
  --ease:cubic-bezier(.2,.7,.3,1);
}

html[data-theme="light"]{
  --ink:#F5F8FC;
  --surface:#ffffff;
  --surface-2:#f2f6fc;
  --surface-3:#e9f0f9;
  --line:#d8e2f0;
  --line-soft:#e6edf6;
  --text:#0B1120;
  --text-muted:#4a5c78;
  --text-faint:#7688a3;
  --signal:#0f9aa8;
  --signal-dim:#7fd3db;
  --signal-glow:rgba(15,154,168,.12);
  --win:#c9860f;
  --win-glow:rgba(201,134,15,.12);
  --gate:#7c5cf0;
  --gate-glow:rgba(124,92,240,.12);
  --pass:#1f9d57;
  --alert:#d94a4a;
  --shadow:0 1px 2px rgba(16,32,64,.06),0 10px 30px rgba(16,32,64,.08);
  --shadow-soft:0 1px 3px rgba(16,32,64,.06);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 82% -8%,var(--signal-glow),transparent 60%),
    radial-gradient(900px 500px at -6% 12%,var(--gate-glow),transparent 55%),
    var(--ink);
  color:var(--text);
  font-family:var(--ff-sans);
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  min-height:100vh;
}
a{color:var(--signal);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.02em}
p{margin:0}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--ff-mono);font-size:.86em}
.kicker{font-family:var(--ff-serif);font-style:italic;color:var(--signal);
  font-size:.98rem;letter-spacing:.01em}
.tnum{font-variant-numeric:tabular-nums}

/* skip link */
.skip{position:absolute;left:-999px;top:8px;background:var(--surface-2);color:var(--text);
  padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:12px}

/* ---------------- shell ---------------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.app > div{min-width:0} /* let the content column shrink below its content min-width */
.rail{
  position:sticky;top:0;align-self:start;height:100vh;
  border-right:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--ink));
  padding:22px 16px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.brand .mark{width:34px;height:34px;flex:0 0 auto}
.brand b{font-size:1.02rem;letter-spacing:-.01em;display:block}
.brand small{color:var(--text-faint);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.navlink{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:transparent;border:0;color:var(--text-muted);cursor:pointer;
  padding:9px 11px;border-radius:var(--radius-sm);font-size:.92rem;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.navlink svg{width:17px;height:17px;flex:0 0 auto;opacity:.85}
.navlink:hover{background:var(--surface-2);color:var(--text)}
.navlink.active{background:var(--signal-glow);color:var(--text)}
.navlink.active svg{color:var(--signal);opacity:1}
.navlink .count{margin-left:auto;font-size:.72rem;color:var(--text-faint);
  background:var(--surface-2);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}

/* topbar (mobile) */
.topbar{display:none}
/* backdrop is out-of-flow at all sizes so it never becomes a grid item */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;display:none}
.backdrop.open{display:block}

/* collapsible rail (desktop only). Fixed like the backdrop, so it is out of
 * flow and never becomes a grid item. Below 861px the topbar hamburger already
 * owns showing and hiding the rail, so this control stays hidden there and the
 * collapse rules are scoped away from the drawer: `.app.rail-hidden .rail` is
 * more specific than `.rail.open` and would otherwise wedge the drawer shut. */
.railtoggle{display:none}
@media (min-width:861px){
  .railtoggle{
    position:fixed;top:15px;left:calc(var(--rail) - 14px);z-index:60;
    display:grid;place-items:center;width:26px;height:26px;padding:0;
    border:1px solid var(--line);border-radius:999px;
    background:var(--surface-2);color:var(--text-faint);cursor:pointer;
    transition:left var(--dur) var(--ease),background var(--dur) var(--ease),
               color var(--dur) var(--ease);
  }
  .railtoggle:hover{background:var(--surface-3);color:var(--text)}
  .railtoggle:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .railtoggle svg{width:13px;height:13px;transition:transform var(--dur) var(--ease)}
  /* Folding the rail must hand its width to the content, not to whitespace:
   * .wrap is capped at --maxw and centred, so without this the chat stayed
   * 1120px wide and simply floated in a wider empty page. Raising the cap here
   * only lifts a ceiling — narrow viewports are unaffected because max-width
   * never forces a width. */
  .app.rail-hidden{grid-template-columns:0 1fr;--maxw:1400px}
  /* Collapse the rail WITHOUT display:none. `display:none` removes it as a grid
   * item, and the main column then auto-places into track 1, which is 0 wide, so
   * the whole page collapses into a sliver.
   * visibility:hidden keeps the item (and drops it from the tab order). */
  .app.rail-hidden .rail{
    visibility:hidden;width:0;min-width:0;padding:0;border-right:0;overflow:hidden;
  }
  .app.rail-hidden .railtoggle{left:10px}
  .app.rail-hidden .railtoggle svg{transform:rotate(180deg)}
}
@media (prefers-reduced-motion:reduce){
  .railtoggle,.railtoggle svg{transition:none}
}

.main{min-width:0;padding:30px clamp(18px,4vw,44px) 80px}
.wrap{max-width:var(--maxw);margin:0 auto;min-width:0}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  border:1px solid var(--line);background:var(--surface-2);color:var(--text);
  padding:9px 15px;border-radius:var(--radius-sm);font-size:.88rem;font-weight:600;
  cursor:pointer;transition:transform .12s var(--ease),background var(--dur),border-color var(--dur);
}
.btn:hover{background:var(--surface-3);border-color:var(--signal-dim)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--signal);border-color:var(--signal);color:#04222a}
.btn-primary:hover{background:#4fd6e2;border-color:#4fd6e2}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 11px;font-size:.8rem}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--surface-2);color:var(--text);cursor:pointer}
.iconbtn:hover{background:var(--surface-3)}
.iconbtn svg{width:18px;height:18px}

/* view header */
.vhead{margin-bottom:26px}
.vhead h1{font-size:clamp(1.7rem,3.4vw,2.5rem);font-weight:800}
.vhead .sub{color:var(--text-muted);margin-top:10px;max-width:66ch;font-size:1.02rem}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-soft)}
.pad{padding:20px}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 30px}
.stat{position:relative;overflow:hidden;padding:18px}
.stat .lab{color:var(--text-faint);font-size:.74rem;text-transform:uppercase;letter-spacing:.09em}
.stat .val{font-size:2rem;font-weight:800;margin-top:8px;letter-spacing:-.03em}
.stat .val small{font-size:.9rem;color:var(--text-faint);font-weight:600}
.stat .bar{height:4px;border-radius:999px;background:var(--line);margin-top:14px;overflow:hidden}
.stat .bar > i{display:block;height:100%;border-radius:999px;background:var(--signal);transition:width .6s var(--ease)}
.stat.win .val{color:var(--win)} .stat.win .bar>i{background:var(--win)}
.stat.check .val{color:var(--gate)} .stat.check .bar>i{background:var(--gate)}

/* next-session callout */
.callout{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;border-radius:var(--radius);
  background:linear-gradient(120deg,var(--signal-glow),transparent 70%),var(--surface);
  border:1px solid var(--signal-dim);margin-bottom:8px}
.callout .dot{margin-top:5px;width:10px;height:10px;border-radius:50%;background:var(--signal);
  box-shadow:0 0 0 4px var(--signal-glow);flex:0 0 auto}
.callout h3{font-size:1.02rem}
.callout ol{margin:10px 0 0;padding-left:20px;color:var(--text-muted);font-size:.94rem}
.callout ol li{margin:4px 0}

/* section title */
.sect-title{display:flex;align-items:center;gap:12px;margin:34px 0 16px}
.sect-title h2{font-size:1.18rem;font-weight:700}
.sect-title .rule{flex:1;height:1px;background:var(--line)}
.sect-title .kick{color:var(--text-faint);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}

/* ---------- stage path (the signature) ---------- */
.path{position:relative;padding-left:14px}
.stage-row{position:relative;display:grid;grid-template-columns:64px 1fr;gap:0;padding:0 0 4px}
.stage-row .spine{position:relative;display:flex;justify-content:center}
.stage-row .spine::before{content:"";position:absolute;top:0;bottom:0;width:3px;left:50%;transform:translateX(-50%);
  background:var(--line)}
.stage-row:first-child .spine::before{top:26px}
.stage-row:last-child .spine::before{bottom:calc(100% - 26px)}
.stage-row .spine.filled::before{background:linear-gradient(180deg,var(--signal),var(--signal-dim))}
.node{position:relative;z-index:2;margin-top:14px;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;
  color:var(--text-faint);font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums;
  transition:all var(--dur) var(--ease)}
.node.done{border-color:var(--win);background:var(--win);color:#3a2600;box-shadow:0 0 0 5px var(--win-glow)}
.node.doing{border-color:var(--signal);background:var(--surface-2);color:var(--signal);box-shadow:0 0 0 5px var(--signal-glow)}
.node.check{border-style:solid}
.stage-row .body{padding:8px 0 22px 6px;min-width:0}
.stagebtn{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 16px;cursor:pointer;color:var(--text);
  transition:border-color var(--dur),background var(--dur),transform .12s var(--ease);
  display:flex;gap:14px;align-items:center}
.stagebtn:hover{border-color:var(--signal-dim);background:var(--surface-2)}
.stagebtn .stagenum{font-size:.72rem;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase}
.stagebtn .ttl{font-weight:700;font-size:1rem;margin-top:3px}
.stagebtn .meta{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.stagebtn .grow{flex:1;min-width:0}
.chip{font-size:.72rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line);
  color:var(--text-muted);background:var(--surface-2);white-space:nowrap}
.chip.tag{border-color:var(--signal-dim);color:var(--signal)}
.chip.check{border-color:var(--gate);color:var(--gate);background:var(--gate-glow)}
.chip.win{border-color:var(--win);color:var(--win);background:var(--win-glow)}
.chip.alert{border-color:var(--alert);color:var(--alert)}
.chip.pass{border-color:var(--pass);color:var(--pass)}
.stagestatus{flex:0 0 auto;display:flex;align-items:center;gap:6px;color:var(--text-faint);font-size:.8rem}

/* stage detail panel */
.stagepanel{margin:2px 0 8px;border:1px solid var(--line);border-left:3px solid var(--signal);
  border-radius:var(--radius);background:var(--surface-2);padding:18px 18px 8px;animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.stagepanel h4{font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin:6px 0 10px}
.trow{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:11px 0;border-top:1px solid var(--line-soft)}
.trow:first-of-type{border-top:0}
.trow .cite{font-family:var(--ff-mono);font-size:.8rem;color:var(--signal);word-break:break-word}
.trow .teach{color:var(--text-muted);font-size:.92rem}
.trow .q{margin-top:8px}
.qtoggle{background:transparent;border:1px dashed var(--line);color:var(--text-faint);
  border-radius:8px;padding:5px 10px;font-size:.8rem;cursor:pointer}
.qtoggle:hover{color:var(--text);border-color:var(--signal-dim)}
.qbody{margin-top:8px;padding:10px 12px;background:var(--surface);border-radius:8px;
  border:1px solid var(--line);font-size:.9rem}
.qbody.socratic{color:var(--text)}

/* tier tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--text-muted);cursor:pointer;font-size:.88rem;font-weight:600;transition:all var(--dur)}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.active{background:var(--signal);border-color:var(--signal);color:#04222a}
.tab .n{opacity:.7;margin-left:6px;font-weight:500}

/* grid of topic / practice cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tcard{padding:18px;display:flex;flex-direction:column;gap:10px}
.tcard .id{font-family:var(--ff-mono);font-size:.78rem;color:var(--gate);font-weight:600}
.tcard h3{font-size:1.02rem}
.tcard .cite{font-family:var(--ff-mono);font-size:.78rem;color:var(--signal);word-break:break-word}
.tcard .teach{color:var(--text-muted);font-size:.9rem;flex:1}
.tcard .foot{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.checkline{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;font-size:.86rem;color:var(--text-muted)}
.checkbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;
  flex:0 0 auto;transition:all var(--dur)}
.checkline input{position:absolute;opacity:0;width:0;height:0}
.checkline input:checked + .checkbox{background:var(--win);border-color:var(--win)}
.checkline input:checked + .checkbox svg{opacity:1}
.checkbox svg{width:12px;height:12px;opacity:0;color:#3a2600}
.checkline input:focus-visible + .checkbox{outline:2px solid var(--signal);outline-offset:2px}

/* practice card */
.pcard .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pcard .desc{color:var(--text-muted);font-size:.9rem}
.seg{display:flex;flex-wrap:wrap;gap:6px;max-width:100%}
.seg button{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;color:var(--text-faint);
  padding:6px 11px;font-size:.75rem;cursor:pointer;font-weight:600;white-space:nowrap}
.seg button.on{color:var(--text);border-color:var(--text-faint)}
.seg button[data-v="doing"].on{background:var(--signal-glow);color:var(--signal);border-color:var(--signal-dim)}
.seg button[data-v="done"].on{background:var(--win-glow);color:var(--win);border-color:var(--win)}
.seg button[data-v="outstanding"].on{background:rgba(248,113,113,.14);color:var(--alert);border-color:var(--alert)}
textarea.notes{width:100%;min-height:64px;resize:vertical;background:var(--surface-2);color:var(--text);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font-family:inherit;font-size:.88rem}
textarea.notes:focus{border-color:var(--signal-dim);outline:none}

/* forms / inputs */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.8rem;color:var(--text-muted);font-weight:600}
.inp,select.inp{background:var(--surface-2);color:var(--text);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:10px 12px;font-family:inherit;font-size:.92rem;width:100%}
.inp:focus{border-color:var(--signal-dim);outline:none}
textarea.inp{resize:vertical;min-height:80px}
/* The diagnostic. One card per question, tight enough that twenty of them read
 * as a form to work through rather than twenty screens to survive. */
.probes{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.card.probe{padding:12px 14px;background:var(--surface-2)}
.probe .id{font-size:.72rem;letter-spacing:.02em;color:var(--muted);
  text-transform:uppercase;margin-bottom:4px}
.probe-about{font-weight:600;line-height:1.35;margin-bottom:2px}
.probe p.muted{margin:2px 0 8px}
textarea.probe-answer{min-height:48px;width:100%}
/* The source ledger. Ranked by how far the source is from the thing it
 * describes, so a standard sits above an article about that standard. */
.btn-sm{padding:5px 10px;font-size:.8rem}
.srclist{display:flex;flex-direction:column;gap:12px}
.card.src.quarantined{opacity:.55}
.srctop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.vet{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;
  padding:2px 7px;border-radius:99px;border:1px solid var(--line)}
.vet-primary{color:var(--signal);border-color:var(--signal-dim)}
.vet-secondary,.vet-vendor{color:var(--text);opacity:.85}
.vet-community,.vet-quar{color:var(--muted)}
.trust,.srcid{font-size:.72rem;color:var(--muted)}
.card.src h3{margin:2px 0 6px;font-size:1rem;line-height:1.3}
.srcmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);
  margin-bottom:6px}
.srcserves{font-size:.78rem;color:var(--muted);margin:6px 0 8px}
.card.run{margin-top:12px}
.drops{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.drop{border-left:2px solid var(--line);padding-left:10px}
.dstage{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin-right:8px}
.durl{font-size:.76rem;word-break:break-all}
.dwhy{font-size:.78rem;color:var(--muted);margin-top:2px}
/* The track switcher. */
.findbox{background:var(--surface-2);margin:12px 0}
/* a supplied resource: the form, and the report on what the cut kept */
.filebox .fl{display:block;margin:10px 0 2px;font-size:13px;font-weight:600}
.filebox .fl input,.filebox .fl select{display:block;width:100%;margin-top:4px;
  padding:7px 9px;font:inherit;font-size:13px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:6px}
.filebox .fl input:focus,.filebox .fl select:focus{outline:2px solid var(--accent);
  outline-offset:-1px}
.tiny{font-size:11.5px;margin:3px 0 0}
.srcreport{margin:12px 0;background:var(--surface-2)}
.statrow{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0;font-size:12.5px;
  color:var(--muted)}
.statrow b{color:var(--ink);font-size:14px}
.warnbox{margin:12px 0;border-left:3px solid var(--warn,#b8860b)}
p.warn{color:var(--warn,#b8860b);margin:8px 0 0}
ul.tight{margin:6px 0 0;padding-left:18px}
ul.tight li{margin:2px 0;font-size:12.5px}
.switcher{margin-top:20px}
.trow{display:flex;align-items:center;gap:10px;padding:7px 0;
  border-top:1px solid var(--line)}
.trow:first-of-type{border-top:none}
.tname{flex:1;min-width:0}
.tid{font-size:.72rem;color:var(--muted)}
.tnow{font-size:.72rem;color:var(--signal);text-transform:uppercase;
  letter-spacing:.06em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* session timeline */
.sess{border-left:2px solid var(--line);padding-left:20px;position:relative;margin-bottom:24px}
.sess::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;
  background:var(--signal);border:2px solid var(--ink)}
.sess .date{font-family:var(--ff-mono);font-size:.8rem;color:var(--signal)}
.sess h3{margin:4px 0 8px;font-size:1.06rem}
.sess .block{margin:10px 0}
.sess .block b{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);margin-bottom:4px}
.sess .block p{color:var(--text-muted);font-size:.92rem}
.sess .recapq{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;font-size:.88rem}
.sess .recapq .a{color:var(--text-faint);margin-top:4px}

/* Q&A log */
.qa-item{padding:16px;margin-bottom:12px}
.qa-item .qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qa-item .ts{font-family:var(--ff-mono);font-size:.74rem;color:var(--text-faint)}
.qa-item .qq{font-weight:600;margin-bottom:6px}
.qa-item .aa{color:var(--text-muted);font-size:.93rem;white-space:pre-wrap}

/* recap drill */
.flash{max-width:640px;margin:0 auto}
.flashcard{min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:34px;border:1px solid var(--line);border-radius:var(--radius-lg);
  background:linear-gradient(160deg,var(--surface-2),var(--surface));box-shadow:var(--shadow)}
.flashcard .qtext{font-size:1.24rem;font-weight:700;line-height:1.35}
.flashcard .atext{color:var(--signal);font-size:1.02rem;margin-top:8px}
.flashcard .tag{margin-top:16px;font-size:.74rem;color:var(--text-faint)}
.flash-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.weaklist{margin-top:30px}
.weakitem{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border:1px solid var(--alert);
  border-radius:var(--radius-sm);background:rgba(248,113,113,.06);margin-bottom:8px;font-size:.9rem}

/* interview question bank */
.qcard{padding:18px;margin-bottom:14px}
.qcard .qhead{display:flex;gap:10px;align-items:baseline}
.qcard .num{font-family:var(--ff-mono);color:var(--gate);font-weight:700;font-size:.92rem}
.qcard .qtext{font-weight:600}
.qcard .src{margin-top:10px;font-size:.84rem;color:var(--text-muted);display:none}
.qcard .src.show{display:block}
.qcard .src .lab{color:var(--text-faint)}
.qcard .grades{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.gbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--text-faint);border-radius:999px;
  padding:5px 13px;font-size:.78rem;cursor:pointer;font-weight:600}
.gbtn.on[data-g="correct"]{background:rgba(74,222,128,.14);border-color:var(--pass);color:var(--pass)}
.gbtn.on[data-g="partial"]{background:var(--win-glow);border-color:var(--win);color:var(--win)}
.gbtn.on[data-g="miss"]{background:rgba(248,113,113,.14);border-color:var(--alert);color:var(--alert)}

/* your story */
.numtable{width:100%;border-collapse:collapse;font-size:.92rem}
.numtable th,.numtable td{text-align:left;padding:12px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.numtable th{color:var(--text-faint);font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.numtable .metric{font-weight:700;white-space:nowrap}
.numtable .value{color:var(--signal);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.numtable .caveat{color:var(--text-muted)}
.numtable .src{font-family:var(--ff-mono);font-size:.76rem;color:var(--text-faint)}
.risk{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line-soft)}
.risk:first-child{border-top:0}
.risk .ic{color:var(--alert);flex:0 0 auto;margin-top:2px}
.risk p{font-size:.94rem;color:var(--text-muted)}

/* ---- Continue (guided resume) ---- */
.cont{display:grid;grid-template-columns:1fr minmax(270px,320px);gap:26px;align-items:start}
.cont>*{min-width:0}
/* Clears the pinned bar. Its height is not a constant, because the model picker
 * wraps to a second line on a narrow window, so the offset is measured at render
 * time into --stepbar-h rather than guessed. */
.cont-side{position:sticky;top:calc(var(--stepbar-h,54px) + 18px)}
/* collapsible progress panel (desktop only, mirroring the rail). Sticky makes
 * .cont-side a containing block, so the button rides the panel's left edge. */
.sidetoggle{display:none}
@media (min-width:861px){
  .sidetoggle{
    position:absolute;top:9px;left:-13px;z-index:12;
    display:grid;place-items:center;gap:5px;width:26px;height:26px;padding:0;
    border:1px solid var(--line);border-radius:999px;
    background:var(--surface-2);color:var(--text-faint);cursor:pointer;
    transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
  }
  .sidetoggle:hover{background:var(--surface-3);color:var(--text)}
  .sidetoggle:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .sidetoggle svg{width:13px;height:13px;transition:transform var(--dur) var(--ease)}
  .sidetoggle .sidepct{display:none}
  /* Collapsed: the panel folds away and the aside becomes a 34px rail that
   * keeps the one number worth glancing at. Same grid-item rule as the rail —
   * the aside stays a grid item so the chat column cannot auto-place into it. */
  .cont.side-hidden{grid-template-columns:1fr 34px}
  .cont.side-hidden .cont-panel{display:none}
  .cont.side-hidden .sidetoggle{
    position:static;width:34px;height:auto;margin-left:auto;
    padding:7px 0 8px;border-radius:var(--radius-sm);
  }
  .cont.side-hidden .sidetoggle svg{transform:rotate(180deg)}
  .cont.side-hidden .sidetoggle .sidepct{
    display:block;font-size:.64rem;font-weight:700;letter-spacing:-.02em;
    color:var(--text-muted);font-variant-numeric:tabular-nums;
  }
}
@media (prefers-reduced-motion:reduce){ .sidetoggle,.sidetoggle svg{transition:none} }
.stepcard{padding:24px}
.steptag{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint)}
.steptitle{font-size:1.34rem;font-weight:800;margin:6px 0 6px;letter-spacing:-.02em}
.chatlog{display:flex;flex-direction:column;margin-top:6px}
.bubble{max-width:86%;padding:12px 15px;border-radius:14px;font-size:.95rem;line-height:1.55;margin:7px 0;border:1px solid var(--line)}
.bubble .who{font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);margin-bottom:5px}
.bubble.tutor{background:var(--surface-2);border-top-left-radius:4px;align-self:flex-start}
.bubble.hint{background:transparent;border-style:dashed;color:var(--text-muted);font-size:.9rem;align-self:flex-start}
.bubble.me{background:var(--signal-glow);border-color:var(--signal-dim);border-top-right-radius:4px;align-self:flex-end}
.bubble.assistant{background:var(--surface-2);border-left:2px solid var(--signal);border-top-left-radius:4px;align-self:flex-start}
.bubble.assistant code{background:var(--surface-3);padding:1px 5px;border-radius:5px;font-size:.86em}
.bubble.sys{background:transparent;border-style:dashed;border-color:var(--gate);color:var(--text-muted);font-size:.86rem;align-self:stretch;max-width:100%}

/* Grounding footer. Three states, using the palette that already means these
   things: --alert for a claim that was not in the sources, --text-faint for a
   turn that had no sources at all, --signal for the sections it did read. A
   fourth colour would be a second vocabulary for the same idea. */
.ground{margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:.78rem;line-height:1.5;color:var(--text-faint)}
.ground code{background:var(--surface-3);padding:1px 5px;border-radius:5px;font-family:var(--ff-mono);font-size:.94em;color:var(--text-muted)}
.ground .glabel{text-transform:uppercase;letter-spacing:.07em;font-size:.92em;margin-right:6px}
.ground code.used{color:var(--signal);border:1px solid var(--signal-dim);background:var(--signal-glow)}
.ground.bad{margin:10px 0 0;padding:9px 11px;border:1px solid var(--alert);border-radius:var(--radius-sm);background:rgba(248,113,113,.10);color:var(--text)}
.ground.bad b{color:var(--alert)}
.ground.bad code{background:rgba(248,113,113,.16);color:var(--text)}
.ground.none{font-style:italic}
.ground .gsha{float:right;opacity:.5;font-family:var(--ff-mono);font-size:.9em}
@media (max-width:640px){.ground .gsha{display:none}}

/* ---- the guided path -----------------------------------------------------
   Built from the tokens already defined above. No new colours, no second type
   scale: a flow that looked like a different product would read as a different
   product. Generous space and one action per card is the whole design. */
.muted{color:var(--text-muted);margin-top:10px;max-width:70ch;line-height:1.6}
.muted.small{font-size:.85rem;color:var(--text-faint)}
.muted.next{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.stagecard{max-width:760px}
.stagecard h2{font-size:1.28rem;font-weight:700;letter-spacing:-.01em}
.card.busy{max-width:760px;margin-bottom:16px;color:var(--text-muted);display:flex;
  align-items:center;gap:12px}
.card.busy .dots{display:inline-flex;gap:5px}
.card.busy .dots i{width:7px;height:7px;border-radius:50%;background:var(--signal);
  opacity:.4;animation:blink 1.2s infinite}
.card.busy .dots i:nth-child(2){animation-delay:.2s}
.card.busy .dots i:nth-child(3){animation-delay:.4s}

.fl{display:block;margin-top:18px;margin-bottom:7px;font-size:.78rem;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}
.fl.inline{margin-top:0;margin-bottom:0;margin-right:10px}
.in{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm);
  color:var(--text);padding:11px 13px;font-size:.95rem;font-family:inherit;
  transition:border-color var(--dur),box-shadow var(--dur)}
.in:focus{outline:none;border-color:var(--signal-dim);box-shadow:0 0 0 3px var(--signal-glow)}
.in::placeholder{color:var(--text-faint)}
.in.ta{resize:vertical;min-height:96px;line-height:1.55}
.in.sel{width:auto;min-width:280px}
.fold{margin-top:20px;border-top:1px solid var(--line-soft);padding-top:14px}
.fold summary{cursor:pointer;color:var(--text-muted);font-size:.88rem;font-weight:600}
.fold summary::marker{color:var(--text-faint)}

/* The rail. Passed stages are not links: going back would re-propose a gap list
   over one the store already holds, which it refuses, so it would be a button
   that only ever produces an error. */
.rail-flow{display:flex;flex-wrap:wrap;gap:6px 4px;list-style:none;margin:0 0 26px;padding:0}
.rf{display:flex;align-items:center;gap:8px;padding:7px 13px 7px 8px;border-radius:999px;
  border:1px solid var(--line-soft);font-size:.82rem;color:var(--text-faint);background:transparent}
.rf .rfdot{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;
  border:1px solid var(--line);font-size:.68rem;font-weight:700;flex:none}
.rf.done{color:var(--text-muted);border-color:var(--line)}
.rf.done .rfdot{background:var(--pass);border-color:var(--pass);color:var(--ink)}
.rf.now{color:var(--text);border-color:var(--signal-dim);background:var(--signal-glow)}
.rf.now .rfdot{background:var(--signal);border-color:var(--signal);color:#04222a}
@media (max-width:640px){.rf.next{display:none}}

.gaplist{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.gap{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;
  background:var(--surface-2);transition:border-color var(--dur),opacity var(--dur)}
.gap.approved{border-color:var(--signal-dim)}
.gap.declined{opacity:.55}
.gtop{display:flex;gap:10px;align-items:center;margin-bottom:7px}
.gtag{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.gtag.jd{color:var(--signal);border-color:var(--signal-dim);background:var(--signal-glow)}
.gtag.cv{color:var(--win);border-color:var(--win);background:var(--win-glow)}
.glvl{font-size:.7rem;color:var(--text-faint);letter-spacing:.05em;text-transform:uppercase}
.glabel2{font-weight:650;line-height:1.45}
.gwhy{color:var(--text-faint);font-size:.85rem;margin-top:5px;line-height:1.5}
.grow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.gdone{font-size:.8rem;font-weight:600;color:var(--text-muted)}
.gdone.approved{color:var(--signal)}

.reslist{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;
  font-size:.84rem}
.reslist li{display:flex;flex-direction:column;gap:3px;padding:9px 11px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--surface-2)}
.reslist li.ok{border-left:2px solid var(--pass)}
.reslist li.bad{border-left:2px solid var(--alert)}
.reslist code{font-family:var(--ff-mono);font-size:.92em;color:var(--text-muted);word-break:break-all}
.reslist span{color:var(--text-faint)}
/* Session-review bubble. Full width and its own accent because it is not
   conversation: it reads a session back rather than adding a turn to it. */
.bubble.review{background:var(--surface-2);border-left:2px solid var(--gate);border-top-left-radius:4px;align-self:stretch;max-width:100%}
.bubble.think .dots{display:inline-flex;gap:5px;padding:3px 0}
.bubble.think .dots i{width:7px;height:7px;border-radius:50%;background:var(--signal);opacity:.4;animation:blink 1.2s infinite}
.bubble.think .dots i:nth-child(2){animation-delay:.2s}
.bubble.think .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.bubble.think .dots i{animation:none;opacity:.6}}
/* Pinned step bar. Orientation (which stage) and the model picker have to stay
 * reachable once a chat runs past a screen, the same way the progress card on
 * the right stays put. Only one line of it is pinned, not the whole heading —
 * a 200px banner following you down the page costs more than it gives.
 * The negative side margins bleed it to the column edges so content does not
 * slide through a gap beside it. */
.stepbar{position:sticky;top:0;z-index:30;
  display:flex;flex-wrap:wrap;gap:9px 12px;align-items:center;
  margin:0 calc(-1*clamp(18px,4vw,44px)) 22px;
  padding:10px clamp(18px,4vw,44px);
  background:color-mix(in srgb,var(--ink) 86%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.stepbar .sbstage{font-weight:700;font-size:.92rem;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38ch;flex:0 1 auto}
.stepbar .sbstage b{color:var(--signal);font-weight:700}
.stepbar .modelbar{margin-top:0;margin-left:auto;gap:8px}
@supports not (backdrop-filter:blur(1px)){ .stepbar{background:var(--ink)} }
/* Back to top. Appears once the pinned bar is doing real work, i.e. once the
 * heading it replaced has scrolled away. */
.totop{position:fixed;right:22px;bottom:22px;z-index:45;
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 15px;border-radius:999px;cursor:pointer;
  font-size:.84rem;font-weight:600;
  color:var(--text);background:var(--surface-2);border:1px solid var(--line);
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .2s var(--ease),transform .2s var(--ease)}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop:hover{border-color:var(--signal);color:var(--signal)}
.totop svg{width:13px;height:13px}
.modelbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;max-width:100%}
.modelbar .mlbl{font-size:.8rem;color:var(--text-muted)}
.mselect{background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;font-size:.85rem;max-width:100%}
.mselect:focus{outline:2px solid var(--signal);outline-offset:1px}
.syncpill{display:inline-flex;align-items:center;font-size:.76rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text-muted)}
.syncpill.ok{color:var(--pass);border-color:var(--pass)}
.syncpill.warn{color:var(--text-muted)}
.syncpill.bad{color:var(--alert);border-color:var(--alert)}
.bstat{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text-muted)}
.bstat .bdot{width:8px;height:8px;border-radius:50%;background:var(--text-faint)}
.bstat.on{color:var(--pass);border-color:var(--pass)}
.bstat.on .bdot{background:var(--pass);box-shadow:0 0 0 3px color-mix(in srgb,var(--pass) 22%,transparent)}
.bstat.off{color:var(--text-muted)}
.bridgehelp{margin-top:10px;max-width:100%}
.bridgehelp code{display:inline-block;background:var(--surface-2);padding:2px 7px;border-radius:5px;margin:2px 0;font-size:.82rem}
.composer{display:flex;gap:10px;margin-top:16px;align-items:flex-end;min-width:0}
.composer textarea{flex:1;min-width:0;min-height:54px}
.deliver-row{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}
.ack{display:flex;gap:12px;align-items:center;padding:14px 18px;border-radius:var(--radius);background:var(--win-glow);border:1px solid var(--win);margin-bottom:16px}
.ack .ic svg{width:20px;height:20px}
.stagedone{text-align:center;padding:38px 24px}
.stagedone .ic svg{width:34px;height:34px;margin-bottom:6px}
.stagedone .big{font-size:1.4rem;font-weight:800;margin:6px 0}
.ring{position:relative;width:134px;height:134px;border-radius:50%;margin:2px auto 0;background:conic-gradient(var(--signal) calc(var(--p)*1%),var(--line-soft) 0)}
.ring::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--surface)}
.ring .ringnum{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-size:1.95rem;font-weight:800;letter-spacing:-.03em}
.ringcap{text-align:center;color:var(--text-faint);font-size:.82rem;margin-top:9px}
.sidehead{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint);margin:18px 0 8px}
.steprow{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:9px;cursor:pointer;font-size:.88rem;color:var(--text-muted)}
.steprow:hover{background:var(--surface-2);color:var(--text)}
.steprow.cur{background:var(--signal-glow);color:var(--text)}
.steprow .box{width:19px;height:19px;border-radius:5px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center}
.steprow.done .box{background:var(--win);border-color:var(--win);color:#3a2600}
.steprow.done .box svg{width:11px;height:11px}
.steprow .stx{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* partial credit: a step with real chat on it but no "delivered" tick */
.steprow .box i{display:block;width:9px;height:9px;border-radius:2px;background:var(--signal)}
.steprow.part .box{border-color:var(--signal)}
.steprow .pctag{font-size:.7rem;color:var(--signal);flex:0 0 auto}
.sidefoot{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
/* whole-track bar + the re-check control */
.trackline{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;font-size:.8rem;color:var(--text-muted)}
.trackline b{font-size:1rem;color:var(--text)}
.tbar{height:6px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--signal);transition:width .35s ease}
.recheck{width:100%;margin-top:12px}
.recheckhint{font-size:.74rem;margin-top:6px;line-height:1.45}
.assessbox{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.assessrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;font-size:.8rem;border-bottom:1px solid var(--line-soft)}
.assessrow:last-child{border-bottom:0}
.assessrow .amk{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--signal)}
.assessrow .amk.zero{color:var(--text-faint)}
.steprow .pctag.dim{color:var(--text-faint);font-weight:500}
.spendrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:5px 0;font-size:.8rem;color:var(--text-muted)}
.spendrow b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.assessrow .atx{min-width:0;flex:1;color:var(--text-muted)}
.assessrow .atx b{color:var(--text);font-weight:600;display:block}
.usage{font-size:.7rem;color:var(--text-faint);margin-left:6px;font-variant-numeric:tabular-nums}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(4,8,16,.66);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:60;overflow-y:auto}
.modal-bg.open{display:flex;animation:fade .2s var(--ease)}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  width:100%;max-width:600px;box-shadow:var(--shadow);padding:24px}
.modal h2{font-size:1.24rem;margin-bottom:4px}
.modal .msub{color:var(--text-muted);font-size:.9rem;margin-bottom:18px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface-3);border:1px solid var(--signal-dim);color:var(--text);
  padding:12px 20px;border-radius:999px;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:all .3s var(--ease);z-index:80;font-size:.9rem;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* empty state */
.empty{text-align:center;padding:50px 20px;color:var(--text-faint)}
.empty svg{width:44px;height:44px;opacity:.5;margin-bottom:12px}
.empty h3{color:var(--text-muted);margin-bottom:6px;font-weight:600}

.view{display:none}
.view.active{display:block;animation:fade .25s var(--ease)}
.hint{color:var(--text-faint);font-size:.82rem}

/* ---------------- responsive ---------------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none;position:fixed;z-index:50;width:min(84vw,300px);height:100vh}
  .rail.open{display:flex}
  .topbar{display:flex;position:sticky;top:0;z-index:40;align-items:center;gap:12px;
    padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar b{flex:1;font-size:1rem}
  .stats{grid-template-columns:repeat(2,1fr)}
  .desk-controls{display:none}
  .main{padding:20px 16px 70px}
  .trow{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .cont{grid-template-columns:1fr}
  .cont-side{position:static}
  .stage-row{grid-template-columns:48px 1fr}
  /* clear the mobile topbar, which is itself sticky at top:0 */
  .stepbar{top:47px;margin:0 -16px 18px;padding:10px 16px}
  .stepbar .sbstage{max-width:100%;flex:1 1 100%;white-space:normal;overflow-wrap:anywhere}
  .stepbar .modelbar{margin-left:0}
  .totop{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  /* ---- phone layout fixes ---- */
  /* Safari zooms the whole page when a focused field is under 16px. */
  .inp,.mselect,select,textarea,input{font-size:16px}
  /* The three-select model bar was a sticky block eating a quarter of
   * the screen. On a phone it scrolls away with the content; the topbar stays
   * as the only pinned chrome. */
  .stepbar{position:static;margin-top:0}
  .cont-side{position:static}
  /* Tap targets: 21px rows are half a fingertip. */
  .spinerow{padding:10px 0}
  .spinerow .sname{padding:6px 0}
  .btn{min-height:40px}
  .btn-sm{min-height:36px}
  .qtoggle{min-height:36px}
  /* Command lines in help bubbles were unwrappable code, and chat bubbles
   * holding a pasted path or long token set the whole column's min-content
   * width. anywhere-wrap the bubble, not just its code. */
  .bridgehelp code,.bubble code{white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
  .bubble{overflow-wrap:anywhere;min-width:0;max-width:100%;box-sizing:border-box}
  .stepcard .mono{overflow-wrap:anywhere}
  /* The hidden back-to-top button was parked off-canvas and widened the page.
   * visibility:hidden was not enough — it still contributed layout width — so
   * on a phone the non-shown state leaves the tree entirely (no fade, fine). */
  .totop:not(.show){display:none}
  .toast{left:12px;right:12px;transform:translateY(20px);max-width:none}
  .toast.show{transform:translateY(0)}
  .main{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  .topbar{padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .rail{padding-top:calc(18px + env(safe-area-inset-top,0px));height:100dvh}
  .composer{position:relative}
  .composer .inp{min-height:44px}
  .resitem .ru{padding:8px 0;margin-top:2px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

.tierchip{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;

.resitem .ru:hover{text-decoration:underline}

.card.spine{margin:0 0 18px}

.spine .sh b{font-size:.94rem}
.spine .sh span{color:var(--text-faint);font-size:.78rem}

.spinerow:first-of-type{border-top:0}
.spinerow.done{color:var(--text-faint)}

.revcard{background:var(--surface-2);border:1px solid var(--gate);border-radius:10px;padding:13px 15px;margin:10px 0}
.revcard h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--gate);margin:0 0 8px}
